<style>
html,body{margin:0;height:100%;background:var(--ml-bg);color:var(--ml-ink);font-family:var(--ml-sans);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
#map{position:fixed;inset:0;background:#050a14}
/* 見出しの下では地図の字を淡く（帯は敷かず、地図そのものを上へ向けて薄める） */
body.zin #map{-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 96px,#000 168px);mask-image:linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 96px,#000 168px)}
.leaflet-container{background:#050a14;font-family:var(--ml-sans)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.6) contrast(.8) saturate(.45)}
.leaflet-control-attribution{background:transparent!important;color:var(--ml-ink-3)!important;font-size:10px;text-shadow:0 0 3px #03060f}
.leaflet-control-attribution a{color:var(--ml-ink-2)!important}
.leaflet-control-zoom{display:none}
/* 見出し */
.hd{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top));z-index:500;pointer-events:none;max-width:calc(100% - 32px)}
.hd a{pointer-events:auto;color:var(--ml-ink-3);font:500 11px/1 var(--ml-mono);letter-spacing:.24em;text-decoration:none}
.hd h1{margin:8px 0 4px;font:600 26px/1.2 var(--ml-serif);letter-spacing:.1em;text-shadow:0 0 12px #03060f,0 0 2px #03060f}
.hd p{margin:0;font-size:13px;color:var(--ml-ink);letter-spacing:.04em;text-shadow:0 0 2px #03060f,0 0 4px #03060f,0 0 10px #03060f,0 0 18px #03060f}
/* 感覚の並び（絞りこみ） */
.senses{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:500;display:flex;gap:6px;justify-content:center;padding:0 16px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;appearance:none;min-height:44px;padding:0 12px;border:1px solid var(--c);border-radius:var(--ml-radius);background:rgba(3,6,15,.55);color:var(--ml-ink);font:500 13px/1 var(--ml-sans);letter-spacing:.06em;display:inline-flex;align-items:center;gap:7px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.68;border-style:dashed}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:none;border:1px solid var(--c)}
.chip[aria-pressed="false"] span{text-decoration:line-through}
.slab{pointer-events:none;align-self:center;font:500 10px/1 var(--ml-mono);letter-spacing:.24em;color:var(--ml-ink-3);text-shadow:0 0 6px #03060f}
.grp{display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--ml-aoi-2);background:rgba(5,9,18,.75);color:var(--ml-ink);flex-direction:column;gap:2px}
.grp span{display:flex;gap:3px}.grp span i{width:8px;height:8px;border-radius:50%}
.grp b{font:500 13px/1 var(--ml-mono);font-weight:500}
#hint{position:fixed;left:56%;top:58%;width:0;height:0;z-index:460;pointer-events:none}
#hint i{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;border:1.5px dashed rgba(232,244,250,.7);background:transparent;animation:hdrag 2.2s var(--ml-ease) 2 both}
#hint i+i{animation-name:hpinch;opacity:0}
@keyframes hdrag{0%{transform:translate(-40px,10px) scale(.7);opacity:0}15%{transform:translate(-40px,10px) scale(1);opacity:1}55%{transform:translate(40px,-10px);opacity:1}70%,100%{transform:translate(40px,-10px) scale(.7);opacity:0}}
@keyframes hpinch{0%,55%{opacity:0;transform:translate(40px,-10px)}70%{opacity:1;transform:translate(40px,-10px)}100%{opacity:0;transform:translate(70px,-34px)}}
@media (prefers-reduced-motion:reduce){#hint{display:none}}
/* 下の操作 */
.bar{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:500;display:flex;gap:10px;justify-content:center}
.btn{appearance:none;min-height:48px;padding:0 22px;border:1px solid var(--ml-aoi);border-radius:var(--ml-radius);background:rgba(3,6,15,.6);color:var(--ml-ink);font:500 15px/1 var(--ml-sans);letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.sub{border-color:var(--ml-line-2);color:var(--ml-ink-2);padding:0 16px}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:2px solid var(--ml-aoi-2);outline-offset:2px}
/* 置く場所の照準 */
.aim{position:fixed;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;z-index:450;pointer-events:none;display:none}
.aim::before,.aim::after{content:"";position:absolute;background:var(--ml-aoi)}
.aim::before{left:18px;top:0;width:1px;height:38px}.aim::after{top:18px;left:0;height:1px;width:38px}
.aim span{position:absolute;inset:9px;border:1px solid var(--ml-aoi-2);border-radius:50%}
body.placing .aim{display:block}
body.placing .senses{display:none}
/* 置くパネル */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 32px));z-index:600;display:none;background:rgba(5,9,18,.86);border:1px solid var(--ml-line-2);border-radius:var(--ml-radius);padding:14px 14px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-sizing:border-box}
body.placing .sheet{display:block}
@media (min-width:900px){.sheet{left:auto;right:24px;transform:none;bottom:calc(84px + env(safe-area-inset-bottom))}body.placing .bar{left:auto;right:24px;width:min(440px,calc(100% - 32px));justify-content:flex-end}}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.opt{appearance:none;flex:1 1 0;min-width:56px;min-height:44px;border:1px solid var(--ml-line-weak);border-radius:var(--ml-radius);background:transparent;color:var(--ml-ink-2);font:500 13px/1.2 var(--ml-sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opt i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.sk{margin:0 0 8px;font:500 11px/1 var(--ml-mono);letter-spacing:.24em;color:var(--ml-ink-3)}
.opt[aria-checked="true"]{border-color:var(--c,var(--ml-aoi));color:var(--ml-ink);box-shadow:inset 0 0 0 1px var(--c,var(--ml-aoi))}
.lv i{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:var(--ml-aoi)}
.txt{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:8px}
.txt input{flex:1;min-width:0;min-height:44px;box-sizing:border-box;border:1px solid var(--ml-line-weak);border-radius:var(--ml-radius);background:rgba(3,6,15,.5);color:var(--ml-ink);padding:0 10px;font:15px var(--ml-sans)}
.ph{min-height:40px}
.thumb{display:none;margin:0 0 8px;align-items:center;gap:10px;font-size:12px;color:var(--ml-ink-3)}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:var(--ml-radius)}
.note{margin:2px 0 0;font-size:13px;line-height:1.6;color:var(--ml-ink-2)}
.txt input.ng{border-color:var(--ml-l-people);box-shadow:inset 0 0 0 1px var(--ml-l-people)}
.btn[aria-disabled="true"]{color:var(--ml-ink-3);border-color:var(--ml-ink-3);border-style:dashed;opacity:.8;cursor:not-allowed}
.err{color:var(--ml-l-people);font-size:15px;font-weight:600;min-height:0;margin:0 0 8px}
/* 印の吹き出し */
.leaflet-popup-content-wrapper{background:rgba(5,9,18,.92);color:var(--ml-ink);border:1px solid var(--ml-line-2);border-radius:var(--ml-radius);box-shadow:none}
.leaflet-popup-tip{background:rgba(5,9,18,.92)}
.leaflet-popup-content{margin:12px 14px;font:13px/1.65 var(--ml-sans);max-width:260px}
.leaflet-container a.leaflet-popup-close-button{color:var(--ml-ink-3)}
.pk{font:500 11px/1 var(--ml-mono);letter-spacing:.2em;color:var(--c);margin:0 0 6px}
.pt{margin:0 0 6px;color:var(--ml-ink)}
.pm{margin:0;color:var(--ml-ink-2);font-size:12px}
.pq{margin:8px 0 0;color:var(--ml-ink);font:13px/1.65 var(--ml-serif);letter-spacing:.04em}
.pm a{color:var(--ml-aoi-2)}
.pa{display:flex;align-items:center;min-height:44px;margin:6px 0 -8px;font:500 12px/1 var(--ml-mono);letter-spacing:.14em;color:var(--ml-ink-2)!important;text-decoration:none;border-top:1px solid var(--ml-line-2)}
.pimg{display:block;width:230px;max-width:100%;height:160px;background:#0a1222;object-fit:cover;margin:0 0 8px;border-radius:var(--ml-radius)}
.del{appearance:none;background:none;border:0;color:var(--ml-ink-3);font:12px var(--ml-sans);padding:8px 0 0;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;top:auto;bottom:calc(200px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:700;font-size:13px;color:var(--ml-ink);text-shadow:0 0 10px #03060f,0 0 2px #03060f;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
body.placing .toast{bottom:auto;top:calc(110px + env(safe-area-inset-top))}
/* スマホ：印の吹き出しをひらいているあいだは、重なる見出しを下げる */
.hd{transition:opacity .25s}
@media (max-width:767px){body.pop .hd{opacity:0}body.pop .hd a{pointer-events:none}}
@media (max-width:767px){.slab{display:none}}   /* 2026-11-22 スマホは札の列に見出しを混ぜない */
@media (min-width:768px){.hd h1{font-size:32px}.senses{bottom:calc(88px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body class="ml-root">
<div id="map" role="application" aria-label="日本の地図"></div>
<header class="hd">
  <a href="/" translate="no">mitsulab</a>
  <h1 translate="no">Qualia/map</h1>
  <p>五感マップ。感じたことを、地図に置いて重ねる。</p>
</header>
<div class="senses" id="senses" aria-label="感覚で絞りこむ"><span class="slab" aria-hidden="true">表示</span></div>
<div id="hint" hidden aria-hidden="true"><i></i><i></i></div>
<div class="aim" aria-hidden="true"><span></span></div>
<form class="sheet" id="sheet" aria-label="感じたことを置く" autocomplete="off">
  <p class="sk">いま、ここで感じること</p>
  <div class="row" id="pSense" role="radiogroup" aria-label="置く感覚"></div>
  <div class="row" id="pLevel" role="radiogroup" aria-label="強さ"></div>
  <div class="txt">
    <input id="pText" maxlength="40" placeholder="ひとこと（任意）" aria-label="ひとこと（40字まで）" enterkeyhint="done">
    <button type="button" class="opt ph" id="pPhoto">＋ 写真（任意）</button>
    <input type="file" id="pFile" accept="image/*" hidden>
  </div>
  <div class="thumb" id="pThumb"><img alt="選んだ写真"><span>顔や車のナンバーが写っていないか確かめてください。<br><button type="button" class="del" id="pNoPhoto">写真を外す</button></span></div>
  <p class="err" id="pErr" role="alert"></p>
  <p class="note">人の名前・住所は書かないでください。この端末にだけ残ります（位置は約 250 m に丸めます）。</p>
</form>
<div class="bar">
  <button class="btn sub" id="bHere" type="button">現在地</button>
  <button class="btn" id="bPut" type="button">感じたことを置く</button>
  <button class="btn sub" id="bCancel" type="button" hidden>やめる</button>
</div>
<div class="toast" id="toast" role="status"></div>

var SEI='佐藤|鈴木|高橋|田中|伊藤|渡辺|山本|中村|小林|加藤|吉田|山田|佐々木|山口|松本|井上|木村|斎藤|清水|山崎|池田|橋本|阿部|石川|山下|中島|石井|小川|前田|岡田|長谷川|藤田|後藤|近藤|村上|遠藤|青木|坂本|斉藤|福田|太田|西村|藤井|金子|岡本|藤原|中野|三浦|原田|中川|松田|竹内|小野|田村|中山|和田|石田|森田|上田|内田|柴田|酒井|宮崎|横山|高木|安藤|宮本|大野|小島|工藤|谷口|今井|高田|丸山|増田|杉山|村田|大塚|小山|平野|藤本|河野|上野|野口|武田|松井|千葉|岩崎|菅原|木下|久保|佐野|野村|松尾';
var SEIH='さとう|すずき|たかはし|たなか|いとう|わたなべ|やまもと|なかむら|こばやし|かとう|よしだ|やまだ|ささき|やまぐち|まつもと|いのうえ|きむら|さいとう|しみず|やまざき|いけだ|はしもと|あべ|いしかわ|やました|なかじま|いしい|おがわ|まえだ|おかだ|ふじた|ごとう|こんどう|むらかみ|えんどう|あおき|さかもと';
var NOTN='(駅|城|町|村|市|区|郡|県|川|山|寺|宮|橋|通り?|線|港|池|沢|台|谷|坂|口|前|園|公園|神社|家|邸|商店|屋)';
var BD='[\\s、。，．・「」（）()!！?？]';
var KN=new RegExp('(?:^|'+BD+'|の|と)('+SEI+')([一-鿿々]{1,2})(?=$|'+BD+'|さん|と|が|は|に|を|へ|で|も|の|です)','g');
var NOTN=/^.?(駅|城|町|村|市|区|郡|県|川|山|寺|宮|橋|通|線|港|池|沢|台|谷|坂|口|前|園|家|邸|屋|道|田|畑|神|社|郷|里|浦|島|野|原|森|林)$/;
var HN=new RegExp('(?:^|'+BD+')('+SEIH+')\\s?[ぁ-ん]{2,4}(?=$|'+BD+'|さん|くん|ちゃん)');
/* 歴史上の人物・作品のゆかり（句碑・生家など）と、植物や食べ物の名は通す */
var OKW=/(句碑|歌碑|文学碑|の碑|の句|の歌|の墓|墓所|記念館|記念碑|生家|旧居|生誕|ゆかり|銅像|の像|の詩|の書)/;
var OKH=/さとうきび|さとういも|あべかわ|いとうり|すずきのこ/;
function nameLike(t){if(OKW.test(t))t=t.replace(new RegExp('('+SEI+')[一-鿿々]{1,2}(?=(の)?'+OKW.source+')','g'),'');t=t.replace(OKH,'');var m;KN.lastIndex=0;while((m=KN.exec(t))){if(!NOTN.test(m[2]))return true}return HN.test(t)||/(^|[\s、。])[一-鿿々]{3,4}と(一緒|いっしょ|歩|行|来|話|会|遊)/.test(t)||/(私|わたし|僕|ぼく|俺)の名前/.test(t)}
var BAD=[/\d[\d\-\s－ー]{8,}\d/,/[0-9０-９]{5,}/,/@|＠/,/https?:|www\.|\.(com|jp|net|org)\b/i,/〒/,/[一-鿿゠-ヿA-Za-z]{1,}(さん|くん|君|ちゃん|様|氏)/,/[\d０-９]+\s*(丁目|番地|番|号)/,/[一二三四五六七八九十〇]+\s*(丁目|番地)/,/(名前|氏名|本名)は/];
