<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qualia/sound ── 聴こえない音</title>
<meta name="description" content="木の中で水が途切れる超音波、土の中の生き物、茎をつたう虫の声、コウモリ、ゾウの低い声。人の耳に届かない音を、届く形に訳して聴く。">
<meta name="tdm-reservation" content="1">
<meta name="robots" content="noai, noimageai">
<link rel="icon" href="favicon/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/","@pixiv/three-vrm":"./vendor/three-vrm/three-vrm.module.min.js"}}</script>
</head>
<body>
<script src="loader/loader.js" data-title="Qualia/sound" data-en="beyond hearing" data-icon="favicon/icon.svg" data-max="4500"></script>
<canvas id="stage" aria-label="聴こえない音の 3D の場面"></canvas>

<header class="top">
  <a class="brand" href="https://mitsulab.jp" target="_blank" rel="noopener">mitsulab</a>
  <div class="series"><span class="ml-label">Qualia/sound</span><b>聴こえない音</b></div>
</header>

<nav id="list" class="list" aria-label="聴く音を選ぶ"></nav>

<p id="cap" class="cap" aria-live="polite"><span class="who">碧</span></p>

<section id="panel" class="panel" aria-label="この音について">
  <div class="head">
    <span id="p-group" class="grp"></span>
    <h1 id="p-title"></h1>
    <p id="p-sub" class="sub"></p>
    <p id="cap2" class="cap2"></p>
  </div>
  <dl class="spec">
    <div><dt>もとの音</dt><dd id="p-band"></dd></div>
    <div><dt>耳との距離</dt><dd id="p-human"></dd></div>
    <div><dt>訳し方</dt><dd id="p-how"></dd></div>
  </dl>
  <p class="tag"><b>再現音</b>録音ではなく、典拠の記録（高さ・長さ・出方）をもとに組み立てた音です。輪・粒・光は音の出方を示す模式で、実際に見えるものではありません。</p>
  <div class="ctrl">
    <button id="play" class="ml-btn play" aria-pressed="false">訳した音を聴く</button>
    <label class="vol">音量<input id="vol" type="range" min="0" max="0.8" step="0.01" value="0.35" aria-label="音量"></label>
    <button id="more" class="more" aria-expanded="false">くわしく</button>
  </div>
  <div class="detail">
    <p id="p-what"></p>
    <p id="p-note" class="note"></p>
    <p class="kit"><span>mitsulab の機材で</span><span id="p-kit"></span></p>
    <h2>典拠</h2>
    <ul id="p-refs" class="refs"></ul>
  </div>
</section>

<footer class="foot">はじめは小さな音量で。© mitsulab. All rights reserved. ／ 質感：Poly Haven（CC0）／ 3D：three.js（MIT）・three-vrm（MIT）</footer>
<script type="module" src="js/app.js?v=20261027a"></script>
</body>
</html>
