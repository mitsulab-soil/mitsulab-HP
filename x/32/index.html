<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qualia/yose ── 館と寄席</title>
<meta name="robots" content="noai,noimageai">
<meta name="tdm-reservation" content="1">
<link rel="preconnect" href="https://mitsulab-soil.github.io" crossorigin><link rel="dns-prefetch" href="https://mitsulab-soil.github.io">
<!-- © mitsulab. All rights reserved. 2026-11-09。Qualia/yose＝Qualia Museum と Qualia/rakugo の集約：時代と文化の受けとり方を館で見て、碧が噺に訳す 8 席を寄席で聴く。各席に、あわせて訪ねる館の部屋を添える。 -->
<style>
:root{--bg:#03060f;--ink:#eef5fb;--aoi:#5cc8e0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
#bar{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid rgba(92,200,224,.25);z-index:2}
#row{height:52px;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px}
#row b{font-weight:400;letter-spacing:.08em;font-size:15px;margin-right:auto;line-height:1.3}#row b small{display:block;font-size:11px;letter-spacing:.02em;color:#cfe3ee}#row button{min-width:56px}
button{height:44px;border-radius:22px;border:1px solid rgba(92,200,224,.4);background:transparent;color:var(--ink);font:inherit;font-size:14px;letter-spacing:.06em;cursor:pointer;padding:0 14px;white-space:nowrap}
button[aria-pressed="true"]{background:rgba(92,200,224,.3);border-color:var(--aoi)}
#seki{display:none;gap:6px;padding:0 8px 8px;grid-template-columns:repeat(8,minmax(0,1fr))}
#seki::-webkit-scrollbar{display:none}
body.yose #seki{display:grid}
#seki .card{height:auto;min-height:44px;border-radius:4px;padding:0;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;background:#07101d;font-size:13px;letter-spacing:.02em}#seki .card img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-position:50% 30%;object-fit:cover;opacity:.9}#seki .card span{display:block;padding:5px 2px 6px;text-align:center;white-space:normal;line-height:1.3}#seki .card[aria-pressed="true"]{border-color:var(--aoi);box-shadow:0 0 0 1px var(--aoi)}
@media (max-width:760px){#seki{grid-template-columns:repeat(4,minmax(0,1fr))}#seki .card img{aspect-ratio:2/1}#seki .card span{font-size:12px;padding:4px 1px 5px}}
#src{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 4px);display:none}body.yose #src{display:block}#src summary{list-style:none;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--aoi)}#src summary::-webkit-details-marker{display:none}#src ol{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 56px);margin:0;padding:12px 14px 12px 34px;background:#07101df2;border:1px solid rgba(92,200,224,.4);border-radius:4px;font-size:12.5px;line-height:1.7;max-height:60vh;overflow:auto;z-index:5}#src ol b{font-weight:500;color:#bfeaf3}
body.yose #row{padding-right:56px}
#app:focus,#app:focus-visible,body.inapp #app{outline:3px solid var(--aoi);outline-offset:-3px}
#go{display:none;padding:0 8px 8px}body.room #go{display:block}#toRoom{width:100%;border-color:var(--aoi)}
#hp{display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;color:var(--ink);text-decoration:none;font-size:24px;margin-left:-8px}
:focus-visible{outline:2px solid var(--aoi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#wait i{animation:none}#wait{transition:none}}
@media (max-width:560px){#go{padding-top:0}#row b small{font-size:10px}}
#app{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;display:block;background:var(--bg)}
#wait{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);color:var(--ink);font-size:14px;letter-spacing:.1em;z-index:1;transition:opacity .4s;pointer-events:none}#wait.off{opacity:0}#wait i{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(92,200,224,.25);border-top-color:var(--aoi);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(1turn)}}#wait small{font-size:12px;color:#cfe3ee;letter-spacing:.04em}
/* 2026-11-10 第4周：題の札（字だけ）を PC 4 列・スマホ 2 列で */
#seki{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}
#seki .card{min-height:52px;justify-content:center;background:#07101d;border-color:rgba(92,200,224,.35)}
#seki .card span{font-size:16px;letter-spacing:.08em;padding:6px 4px 0}
#seki .card small{display:block;font-size:11.5px;color:#cfe3ee;letter-spacing:.02em;padding:0 4px 6px;text-align:center;white-space:normal;line-height:1.35;font-family:"Hiragino Sans",sans-serif}
@media (max-width:760px){#seki{grid-template-columns:repeat(2,minmax(0,1fr))!important}#seki .card{min-height:48px}#seki .card span{font-size:15px}#seki .card small{display:none}}
/* 2026-11-10 第5周：題の格子を一列の細い札に畳み、舞台を主役に。最初のおすすめ「蜂の目」を光らせる */
#seki{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:4px;padding-bottom:6px}
#seki .card{min-height:44px;border-color:transparent;background:transparent}
#seki .card small{display:none}
#seki .card span{font-size:14px;padding:0 2px}
#seki .card[aria-pressed="true"]{border-color:var(--aoi);background:rgba(92,200,224,.14)}
#seki .card.rec{border-color:#ffcf86;animation:rec 2s ease-in-out infinite}
#seki .card.rec span::after{content:"おすすめ";display:block;font:11px/1.3 "Hiragino Sans",sans-serif;color:#ffe2b0;letter-spacing:.08em}
@keyframes rec{50%{box-shadow:0 0 0 4px rgba(255,207,134,.28)}}
@media (max-width:760px){#seki{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:2px}#seki .card{min-height:44px}#seki .card span{font-size:12.5px;letter-spacing:0}#seki .card.rec span::after{font-size:9.5px}}
@media (prefers-reduced-motion:reduce){#seki .card.rec{animation:none}}
#hp{font-size:14px;letter-spacing:.06em;font-family:"Hiragino Sans",sans-serif;padding:0 8px;margin-left:-4px;white-space:nowrap}
@media (max-width:400px){#row b{font-size:13px}#row b small{font-size:9.5px}}
/* 2026-11-10 第6周：高座のまわりを暗くしすぎない（夕方の寄席の木と灯の色）・375 は演目の帯を一段（横に送る） */
:root{--bg:#1d1a22}
#bar{background:linear-gradient(#2a2430,#211d28)}
#app,#wait{background:#1d1a22}
@media (max-width:420px){#row b small{display:none}#row{padding-left:8px}#hp{margin-left:0;padding:0 6px}#row button{min-width:48px;padding:0 10px}}
@media (max-width:760px){#seki{display:none}body.yose #seki{display:flex!important;overflow-x:auto;scroll-snap-type:x proximity;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}#seki .card{flex:0 0 auto;min-width:76px;scroll-snap-align:start;padding:0 6px}#seki .card span{font-size:13.5px;white-space:nowrap}}
</style>
</head>
<body>
<nav id="bar"><div id="row"><a id="hp" href="https://mitsulab.jp/" aria-label="mitsulab のサイトへ戻る">← mitsulab</a><b>Qualia/yose<small>題を押すと、すぐはじまる・小学生から親子で</small></b><button data-v="kan">館</button><button data-v="yose">寄席</button></div><div id="seki" role="group" aria-label="噺を選ぶ（8 席）"></div><details id="src"><summary aria-label="噺ごとの出典">＋</summary><ol id="srcl"></ol></details><div id="go"><button id="toRoom"></button></div></nav>
<div id="wait"><i></i><span id="wt"></span></div>
<iframe id="app" title="Qualia/yose" allow="autoplay; fullscreen"></iframe>
<script>
const MUSEUM = 'https://mitsulab-soil.github.io/museum/', YOSE = 'https://mitsulab-soil.github.io/aoi-shizen-rakugo/';
// 8 席と、あわせて訪ねる館の部屋（館の部屋は名前で案内する）
const S = [['hachi','蜂の目','やさい百景','花と受粉','yasai'],['mimizu','みみずの耳','つち百景','土の中','tsuchi'],['ga','蛾の恋文','かぜ百景','夜風に乗る匂い','kaze'],['kumo','蜘蛛の留守番','あめ百景','雨粒と獲物の揺れを糸で聞く','ame'],['inu','犬の道しるべ','かぜ百景','地面と風の匂い','kaze'],['keyaki','欅の目方','つち百景','土から来ない目方','tsuchi'],['shashin','写真の留守','たいよう百景','光で写す','taiyo'],['hoshi','星の遅刻','つき百景','月の光も約 1.3 秒前','tsuki']];
const app = document.getElementById('app'), bar = document.getElementById('bar'), seki = document.getElementById('seki');
const RK = 'https://mitsulab-soil.github.io/aoi-shizen-rakugo/img/';
// 噺ごとの主な出典（一次の文献。くわしくは寄席の中の「典拠」）
const SRC = { hachi: 'N. Hempel de Ibarra ほか (2014) <i>J. Comp. Physiol. A</i>（ミツバチの色の見え方）', mimizu: 'C. Darwin (1881) <i>The Formation of Vegetable Mould, through the Action of Worms</i> 第一章', ga: 'J. H. Fabre『The Life of the Caterpillar』（英訳 1916）第 11 章', kumo: 'B. Mortimer ほか (2016) <i>J. R. Soc. Interface</i>（網の糸が揺れを伝える）', inu: 'G. J. Romanes (1887) <i>J. Linn. Soc. Zool.</i> 20（犬の嗅覚の実験）', keyaki: 'さいたま市「武蔵一宮氷川神社と氷川参道」・環境省 巨樹・巨木林データベース', shashin: 'パリ市「Un détail imprévu fait revivre un cliché historique」（2026-10-15）', hoshi: '清少納言『枕草子』「星は」の段' };
seki.innerHTML = S.map(([k, t, , g]) => `<button class="card" type="button" data-e="${k}" aria-pressed="false"><span>${t}</span><small>${g}</small></button>`).join('');   // 2026-11-10 第4周：碧の顔の帯をやめ題の札だけに
document.getElementById('srcl').innerHTML = S.map(([k, t]) => `<li><b>${t}</b>　${SRC[k]}</li>`).join('');
seki.querySelector('[data-e="hachi"]').classList.add('rec');
seki.onclick = ev => { const c = ev.target.closest('.card'); if (!c) return; const wr = c.classList.contains('rec'); seki.querySelector('.rec')?.classList.remove('rec'); if (!wr && (new URLSearchParams(location.search).get('e') || '') === c.dataset.e && document.body.classList.contains('yose')) return; go('yose', c.dataset.e, null, null, true); };   // 同じ席はひらき直さない
const fit = () => { const h = bar.offsetHeight; app.style.top = (h + 8) + 'px'; document.getElementById('wait').style.top = h + 'px'; app.style.height = (innerHeight - h - 8) + 'px'; };
function go(v, e, room, from, now) {
  if (v !== 'kan') v = 'yose';
  const s = S.find(x => x[0] === e), f = S.find(x => x[0] === from), b = document.getElementById('toRoom'); document.body.classList.toggle('room', (v === 'yose' && !!s) || (v === 'kan' && !!f));
  if (v === 'yose' && s) { b.textContent = `館の${s[2]}へ（${s[3]}）`; b.onclick = () => go('kan', null, s[4], s[0]); }
  if (v === 'kan' && f) { b.textContent = `寄席の「${f[1]}」へ戻る`; b.onclick = () => go('yose', f[0]); }
  document.body.classList.toggle('yose', v === 'yose');
  document.querySelectorAll('#row button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  seki.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.e === e)));
  app.src = v === 'kan' ? MUSEUM + '?embed=1' + (room ? '&room=' + room : '') : YOSE + '?embed=1' + (e ? '&e=' + e + (now ? '&go=1' : '') : '');
  const u = new URL(location); u.searchParams.set('v', v); e ? u.searchParams.set('e', e) : u.searchParams.delete('e'); history.replaceState(null, '', u);
  fit(); const w = document.getElementById('wait'); document.getElementById('wt').textContent = v === 'kan' ? '館をひらいています' : '寄席をひらいています'; w.classList.remove('off'); clearTimeout(go.t); go.t = setTimeout(() => w.classList.add('off'), 700); if (now && go.ok) setTimeout(() => { try { app.focus(); } catch (x) {} }, 50); go.ok = true;
}
document.querySelectorAll('#row button').forEach(b => b.onclick = () => go(b.dataset.v));
addEventListener('resize', fit);
// 焦点が寄席・館の中にあるときは、枠に印を出す
addEventListener('blur', () => setTimeout(() => document.body.classList.toggle('inapp', document.activeElement === app), 0)); addEventListener('focus', () => document.body.classList.remove('inapp'));
app.addEventListener('load', () => document.getElementById('wait').classList.add('off'));   // 2026-11-09 第2周：読み込みが済んだらすぐ外す（前は 0.6 秒待った）
const q = new URLSearchParams(location.search); const start = () => go(q.get('v'), S.some(s => s[0] === q.get('e')) ? q.get('e') : (q.get('v') === 'kan' ? null : 'hachi'), null, null, q.get('v') !== 'kan');
// 第8周 P1：題の札と枠を先に出し、中の寄席（碧の VRM・板の質感 2.4MB）はこのページの読み込みが済んでから読む＝初回にページが重く止まらない
if (document.readyState === 'complete') requestAnimationFrame(start); else addEventListener('load', () => requestAnimationFrame(start), { once: true });   // 第6周：席は既定のまま始め（席を選ぶ画面を挟まない）、高座の中で後から変えられる   // 2026-11-10 第4周：はじめから一席目の高座を出す（空の高座にしない）
</script>
</body>
</html>
