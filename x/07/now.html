<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="tdm-reservation" content="1">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualia/sound — 今ここ</title>
<meta name="description" content="マイクが拾う今この場所の音を、その場で遅く・速く聴きなおす。">
<style>
:root{--bg:#03060f;--ink:#eef5fb;--dim:#8f9bb4;--line:#26324a;--aoi:#5cc8e0;
--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--goth:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--goth);-webkit-text-size-adjust:100%}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:3}
header a{color:var(--ink);text-decoration:none;font-size:20px;min-width:44px;min-height:44px;display:grid;place-items:center}
header b{font-family:var(--mincho);font-weight:600;letter-spacing:.06em;font-size:17px}
header small{color:var(--dim);font-size:12px}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:4;background:var(--bg)}
#start button{font-family:var(--mincho);font-size:18px;letter-spacing:.08em;color:var(--ink);background:none;border:1px solid var(--aoi);border-radius:999px;padding:14px 28px;min-height:48px;cursor:pointer}
#start p{color:var(--dim);font-size:13px;text-align:center;margin:14px 16px 0;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(12px + env(safe-area-inset-bottom));z-index:3;display:grid;gap:8px;justify-items:center}
.row{display:flex;gap:6px;width:100%;max-width:520px}
.row button{flex:1;min-height:48px;font-family:var(--mincho);font-size:15px;color:var(--ink);background:#03060f99;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.row button small{display:block;font-family:var(--goth);font-size:10px;color:var(--dim)}
.row button[aria-pressed=true]{border-color:var(--aoi);box-shadow:inset 0 0 0 1px var(--aoi)}
#cap{position:fixed;left:12px;right:12px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:3;text-align:center;font-size:13px;line-height:1.6;margin:0}
#cap small{display:block;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<canvas id="cv" aria-label="今の音の高さと強さを、右から左へ流れる模様で表す画面"></canvas>
<header><a href="./" aria-label="Qualia/sound へ戻る">←</a><b>Qualia/sound</b><small>今ここ</small></header>
<div id="start"><div><button id="go" type="button">マイクをひらく</button><p>音は端末の中で直近 4 秒だけ持ち、<br>保存も送信もしません。</p></div></div>
<nav aria-label="聴きなおす速さ">
 <div class="row" id="rates">
  <button data-r="0.25" aria-pressed="false">¼<small>遅く</small></button><button data-r="0.5" aria-pressed="false">½<small>遅く</small></button><button data-r="1" aria-pressed="true">今<small>そのまま</small></button><button data-r="2" aria-pressed="false">×2<small>速く</small></button>
 </div>
 <div class="row"><button id="pitch" aria-pressed="false">音の高さも変える<small>いまは高さを保つ</small></button></div>
</nav>
<p id="cap" aria-live="polite" role="status"></p>
<script>
(()=>{
const cv=document.getElementById('cv'),g=cv.getContext('2d'),cap=document.getElementById('cap');
let ac,an,ring,ri=0,sr=48000,rate=1,keep=true,el=null,snap=null;
const SEC=4;
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d}
addEventListener('resize',size);size();
function say(){
 const lines={1:'今の音。人が聴けるのはおよそ 20 Hz〜20 kHz。',
  0.25:'¼ の速さ。鳥が聴き分ける細かな音の変化が、人の耳でも追える。',
  0.5:'½ の速さ。',2:'2 倍の速さ。長い音のうねりが一つにまとまる。'};
 cap.innerHTML='<small>直近 4 秒</small>'.repeat(rate!=1)+lines[rate]+(rate!=1?'<small>'+(keep?'高さを保ったまま速さだけ変えています。':'テープのように高さも一緒に変えています。')+'</small>':'')+
  (rate==0.25?'<small>鳥は 1〜2 ms、人は 3〜4 ms ほどまで（Dooling et al. 2002 J Acoust Soc Am 112:748）</small>':'<small>超音波はスマホのマイクではほとんど録れません。</small>');
}
// 高さを保った遅い再生は、ブラウザの機能に頼らず端末の中で組み立てる（WSOLA。iOS Safari でも同じに聴こえる）
function grab(){const n=ring.length,o=new Float32Array(n);for(let i=0;i<n;i++)o[i]=ring[(ri+i)%n];return o}
function stretch(x,r){const N=2048,H=N/4,T=384,out=new Float32Array(Math.ceil(x.length/r)+N),w=new Float32Array(N),norm=new Float32Array(out.length);
 for(let i=0;i<N;i++)w[i]=.5-.5*Math.cos(2*Math.PI*i/N);
 let prev=0;for(let k=0,o=0;o+N<out.length;k++,o+=H){let c=Math.round(o*r);if(c+N+T>=x.length)break;
  let best=0;if(k>0){let bv=-1e9;const nat=prev+H;for(let d=-T;d<=T;d+=4){const p=c+d;if(p<0)continue;let v=0;for(let i=0;i<N/2;i+=8)v+=x[p+i]*x[nat+i];if(v>bv){bv=v;best=d}}}
  const p=Math.max(0,c+best);prev=p;for(let i=0;i<N;i++){out[o+i]+=x[p+i]*w[i];norm[o+i]+=w[i]}}
 for(let i=0;i<out.length;i++)if(norm[i]>1e-3)out[i]/=norm[i];return out}
function stop(){if(el){try{el.onended=null;el.stop()}catch(_){}el=null}}
function play(){
 // 再生の途中で速さ・高さを切りかえたら、聴いていた所から続ける（最初から鳴り直さない）
 let off=0;if(el&&!el.paused)off=Math.min(SEC-.3,el.off+(ac.currentTime-el.t0)*el.r);
 stop();say();if(rate==1)return;const x0=snap||(snap=grab()),x=off>0?x0.subarray(Math.floor(off*sr)):x0;
 const y=keep?stretch(x,rate):x,bf=ac.createBuffer(1,y.length,sr);bf.getChannelData(0).set(y);
 const s=ac.createBufferSource();s.buffer=bf;if(!keep)s.playbackRate.value=rate;
 const fade=ac.createGain();fade.gain.value=1;s.connect(fade).connect(ac.destination);
 s.t0=ac.currentTime;s.off=off;s.r=rate;s.dur=y.length/sr/(keep?1:rate);s.paused=false;s.onended=()=>{if(el===s){el=null;setRate(1)}};el=s;s.start()}
function setRate(r){rate=r;document.querySelectorAll('#rates button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.r==r));if(r==1){stop();snap=null;say()}else play()}
document.querySelectorAll('#rates button').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));
const pb=document.getElementById('pitch');pb.onclick=()=>{keep=!keep;pb.setAttribute('aria-pressed',!keep);pb.querySelector('small').textContent=keep?'いまは高さを保つ':'いまは高さも変わる';if(rate!=1)play();else say()};
let fd;
function draw(){requestAnimationFrame(draw);if(!an)return;an.getByteFrequencyData(fd);
 const W=cv.width,H=cv.height,s=Math.max(2,W/300|0);g.drawImage(cv,-s,0);g.fillStyle='rgba(3,6,15,.25)';g.fillRect(W-s,0,s,H);
 const top=H*.12,bot=H*.72,n=fd.length,maxHz=sr/2;
 for(let y=0;y<bot-top;y++){const hz=Math.pow(20000/40,1-y/(bot-top))*40;const k=Math.min(n-1,hz/maxHz*n|0);const v=fd[k]/255;if(v<.12)continue;
  g.fillStyle=`rgba(${70+v*70|0},${190+v*40|0},${224},${v*v})`;g.fillRect(W-s,top+y,s,1)}
 if(el&&!el.paused){const p=Math.min(1,(el.off+(ac.currentTime-el.t0)*el.r)/SEC);g.fillStyle='#5cc8e0';g.fillRect(0,bot+6,W*p,2)}}
function push(d){if(el)return;for(let i=0;i<d.length;i++){ring[ri]=d[i];ri=(ri+1)%ring.length}}
const WK="registerProcessor('cap',class extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}})";
document.getElementById('go').onclick=async()=>{
 // 押した瞬間に音の場を起こす（iOS は押した操作の中でないと音が出ない）
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
 try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  sr=ac.sampleRate;ring=new Float32Array(sr*SEC);
  const m=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.5;fd=new Uint8Array(an.frequencyBinCount);m.connect(an);
  let ok=false;
  if(ac.audioWorklet&&window.AudioWorkletNode){try{const u=URL.createObjectURL(new Blob([WK],{type:'application/javascript'}));await ac.audioWorklet.addModule(u);URL.revokeObjectURL(u);
   const n=new AudioWorkletNode(ac,'cap',{numberOfInputs:1,numberOfOutputs:1});n.port.onmessage=e=>push(e.data);const z=ac.createGain();z.gain.value=0;m.connect(n);n.connect(z).connect(ac.destination);ok=true}catch(_){}}
  if(!ok){const sp=ac.createScriptProcessor(2048,1,1);sp.onaudioprocess=e=>push(e.inputBuffer.getChannelData(0));const z=ac.createGain();z.gain.value=0;m.connect(sp);sp.connect(z);z.connect(ac.destination)}
  document.getElementById('start').remove();say();}
 catch(e){document.querySelector('#start p').textContent='マイクをひらけませんでした。設定でマイクを許可してから、もう一度押してください。'}
};
draw();
})();
</script>
</body>
</html>
