<dialog id="dlgAbout" class="dlg ml-panel">
  <div class="dlg-in">
    <p class="ml-kicker">mitsulab</p>
    <h2 class="ml-title" data-t="about.h">Qualia/touch</h2>
    <p data-t="about.lead"></p>
    <p class="howto">選ぶ：下の左の印で、触れるもの（樹皮・石・布ほか、または手もとの画像）を。まん中の印で、形（板・岩・器ほか）を。<br>なぞる：面を指でなぞると、波紋と音（振動のある端末では振動も）が返ります。面の外をなぞると向きが変わり、二本の指（ホイール）で寄れます。<br>保存：右の印で、形を STL（3D プリント）や GLB に。この端末の中でつくるだけで、送信はしません。選んだ画像も、どこにも送りません。</p>
    <h3 data-t="about.h1"></h3><p data-t="about.p1"></p>
    <h3 data-t="about.h2"></h3><p data-t="about.p2"></p>
    <h3 data-t="about.h3"></h3><p data-t="about.p3"></p>
    <h3 data-t="about.h4"></h3><p data-t="about.p4"></p>
    <details class="ml-fold"><summary data-t="about.h5"></summary><p data-t="about.p5"></p></details>
    <p class="copy"><span data-t="contact">お問い合わせ</span>：<a href="mailto:official@mitsulab.jp">official@mitsulab.jp</a><br><span data-t="copy"></span></p>
    <div class="ml-seg lang" role="group" aria-label="Language"><button type="button" data-lang="ja" aria-pressed="true">日本語</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
    <button class="ml-btn" type="button" data-close data-t="close">閉じる</button>
  </div>
</dialog>
