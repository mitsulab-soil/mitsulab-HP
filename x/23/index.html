<style>
:root{--ink:#eef3f1;--soft:rgba(238,243,241,.72);--aoi:#8fd3e6;--bg:#0c1210}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#cap{position:fixed;isolation:isolate;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,720px);text-align:center;font-size:clamp(14px,1.15vw,16px);line-height:1.7;letter-spacing:.04em;text-shadow:0 1px 6px #000e,0 0 3px #000,0 0 14px rgba(0,0,0,.55);white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere;opacity:0;transition:opacity .6s}
#cap.on{opacity:1}#cap::before{content:'';position:absolute;inset:-10px -18px;z-index:-1;border-radius:24px;background:radial-gradient(ellipse at center,rgba(10,16,14,.42),rgba(10,16,14,0) 72%)}
#go{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);min-width:120px;height:44px;border-radius:22px;border:1px solid rgba(143,211,230,.55);background:rgba(12,18,16,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);font:inherit;font-size:14px;letter-spacing:.2em;cursor:pointer}
#go:active{background:rgba(143,211,230,.18)}
#mark{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top));font-size:12px;letter-spacing:.12em;color:var(--soft)}
#note{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));font-size:10px;color:rgba(238,243,241,.55);text-shadow:0 1px 4px #0008;white-space:nowrap;opacity:0;transition:opacity .6s}#note.on{opacity:1}
#ld{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;transition:opacity .5s}
#ld i{width:28px;height:28px;border-radius:50%;border:1px solid var(--aoi);opacity:.7;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{transform:scale(.6);opacity:.3}}
</style></head><body>
<div id="mark">mitsulab</div>
<div id="note">模式の表現です　© mitsulab</div>
<div id="cap"></div>
