const HIT=[];PL.forEach(p=>{const y=p.far?8:H(p.x,p.z);const o=new THREE.Mesh(new THREE.CylinderGeometry(p.r,p.r,14,20),new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false}));o.position.set(p.x,y+5,p.z);o.userData.p=p;S.add(o);HIT.push(o);p.top=new THREE.Vector3(p.x,y+(p.far?7:p.id==="real"?24:p.id==="hall"?11:9),p.z);
 if(!p.far){p.veil=mist(p.x,y+5,p.z,p.r*2.6,.0,0x9aa0a2)}});
function veils(){PL.forEach(p=>{if(p.veil)p.veil.material.opacity=drawn(p)?0:.5})}veils();

/* ---- カメラ（指で回す・寄る） */
const C0={tx:2,tz:2,az:.12,el:.86};let tgt=new THREE.Vector3(C0.tx,2,C0.tz),az=C0.az,el=C0.el,dist=150,want=null;
function fitDist(){const a=innerWidth/innerHeight,nar=a<.8,hw=nar?RZ+3:RX+6,f=Math.tan(THREE.MathUtils.degToRad(cam.fov/2));return Math.max(hw/(f*a),(nar?RX:RZ)*1.1/f)*(nar?.9:.92)}
let dMin=30,dMax=260;
function setCam(){cam.position.set(tgt.x+dist*Math.sin(az)*Math.cos(el),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(az)*Math.cos(el));cam.lookAt(tgt)}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);$("c").style.width=w+"px";$("c").style.height=h+"px";cam.aspect=w/h;cam.fov=narrow()?44:30;cam.updateProjectionMatrix();if(narrow()&&!sel&&!resize.done)az=C0.az-Math.PI/2;resize.done=1;dMax=fitDist()*1.25;if(!want&&!sel)dist=fitDist();}
function flyTo(p){const d=p?Math.max(dMin,(narrow()?120:92)+p.r*1.2):fitDist();const rt=new THREE.Vector3(Math.cos(az),0,-Math.sin(az)),fw=new THREE.Vector3(-Math.sin(az),0,-Math.cos(az));want={t:p?new THREE.Vector3(p.x,p.far?6:H(p.x,p.z),p.z).addScaledVector(narrow()?fw:rt,narrow()?7:9):new THREE.Vector3(C0.tx,2,C0.tz),d,t0:performance.now(),f:{t:tgt.clone(),d:dist}}}
const V=$("v");let pts=new Map(),dn=null,pinch=null;
V.addEventListener("pointerdown",e=>{if(e.target.closest(".pin,.bld"))return;V.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)dn={x:e.clientX,y:e.clientY,az,el,mv:0,t:performance.now()};else{const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),dist};dn&&(dn.mv=99)}V.classList.add("drag")});
V.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pts.size>1){const [a,b]=[...pts.values()];dist=Math.max(dMin,Math.min(dMax,pinch.dist*pinch.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))));want=null;return}
 if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.mv=Math.max(dn.mv,Math.abs(dx)+Math.abs(dy));if(dn.mv>5){az=dn.az-dx*.006;el=Math.max(.42,Math.min(1.25,dn.el+dy*.004));want&&(want.keepAng=1)}});
function up(e){const wasTap=dn&&dn.mv<6&&pts.size===1;pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0){V.classList.remove("drag");if(wasTap)tap(e);dn=null}}
V.addEventListener("pointerup",up);V.addEventListener("pointercancel",e=>{pts.delete(e.pointerId);dn=null;pinch=null});
V.addEventListener("wheel",e=>{e.preventDefault();dist=Math.max(dMin,Math.min(dMax,dist*Math.exp(e.deltaY*.001)));want=null},{passive:false});
const rc=new THREE.Raycaster(),mp=new THREE.Vector2();
function tap(e){mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(mp,cam);const h=rc.intersectObjects(HIT,false)[0];if(h)open(h.object.userData.p);else if(sel)close()}

/* ---- 札（場所の名・アプリの名） */
const pins=$("pins");
PL.forEach(p=>{const b=document.createElement("button");b.type="button";b.className="pin"+(p.far?" far":"");b.innerHTML="<i>"+(p.far?"":p.ch)+"</i><b>"+p.n+"</b>";b.addEventListener("click",ev=>{ev.stopPropagation();open(p)});p.el=b;pins.appendChild(b)});
const APPS=[["museum",-6,8,-25],["yose",3,6,-27],["lab",12,12,-23],["omiya",19,8,-15],["kawagoe",47,19,-12],["shibuya",42,17,3],["network",25,7,10],["map",12,4,27]].map(([k,x,h,z])=>{const a=document.createElement("a");a.className="bld";a.href=T[k][1];a.target="_blank";a.rel="noopener";a.translate=false;a.setAttribute("aria-label",T[k][0]+" をひらく");a.innerHTML="<span>"+k+"</span>";a.addEventListener("click",()=>{got[k]=1;save();veils()});pins.appendChild(a);return{el:a,v:new THREE.Vector3(x,H(x,z)+h,z)}});
PEDS.forEach(d=>{const a=document.createElement("a");a.className="bld tool";a.href=T[d.k][1];a.target="_blank";a.rel="noopener";a.translate=false;a.setAttribute("aria-label",T[d.k][0]+" をひらく");a.innerHTML="<span>"+d.k+"</span>";a.addEventListener("click",()=>{got[d.k]=1;save();veils()});pins.appendChild(a);APPS.push({el:a,v:new THREE.Vector3(d.x,d.y+1.9,d.z),tool:1})});
const pv=new THREE.Vector3();
function place(el,v,dx){pv.copy(v).project(cam);const on=pv.z<1&&Math.abs(pv.x)<1.1&&Math.abs(pv.y)<1.1;el.style.display=on?"":"none";if(!on)return;const x=(pv.x+1)/2*innerWidth,y=(1-pv.y)/2*innerHeight;el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;if(dx){const bw=el.offsetWidth/2;el.style.setProperty("--dx",(x-bw<16?16-(x-bw):x+bw>innerWidth-16?(innerWidth-16)-(x+bw):0)+"px")}}
function labels(){const zoom=dist<fitDist()*.6;PL.forEach(p=>{p.el.classList.toggle("dim",!!sel&&sel!==p&&narrow());place(p.el,p.top,1)});APPS.forEach(a=>{const near=sel&&Math.hypot(a.v.x-sel.x,a.v.z-sel.z)<sel.r+4;a.el.classList.toggle("hide",sel?!near:!zoom);place(a.el,a.v,0)})}

/* ---- カードと持ち物 */
const card=$("card"),sayT=$("sayT");let sel=null;const say=t=>{sayT.textContent=t};
function open(p){sel=p;PL.forEach(q=>q.el.classList.toggle("on",q===p));$("cCh").textContent=p.ch;$("cH").textContent=p.n;$("cP").textContent=p.p;
 const go=$("cGo");go.innerHTML="";p.t.forEach(k=>{const a=document.createElement("a");a.href=T[k][1];a.target="_blank";a.rel="noopener";a.translate=false;a.textContent=T[k][0];if(got[k])a.className="got";a.addEventListener("click",()=>{got[k]=1;save();a.className="got";renderBag();veils()});go.appendChild(a)});
 go.style.display=p.t.length?"":"none";card.classList.add("show");document.body.classList.add("open");say(p.q);flyTo(p);if(!p.t.length&&!p.far){got["_"+p.id]=1;save()}}
function close(){card.classList.remove("show");document.body.classList.remove("open");sel=null;PL.forEach(q=>q.el.classList.remove("on"));flyTo(null)}
card.querySelector(".x").addEventListener("click",close);
const bag=$("bag"),bB=$("bBag");
function renderBag(){let h="<h3>受けとった記録</h3><ul>";PL.forEach(p=>{if(p.far)return;h+='<li class="'+(drawn(p)?"":"no")+'"><a href="#" data-p="'+p.id+'">'+p.n+"<span>"+(drawn(p)?"霞が晴れた":"霞の中")+"</span></a></li>"});h+="</ul>";
 BAG.forEach(g=>{h+="<h3>"+g[0]+"</h3><ul>";g[1].forEach(k=>{h+='<li class="'+(got[k]?"":"no")+'"><a href="'+T[k][1]+'" target="_blank" rel="noopener" data-k="'+k+'" translate="no">'+T[k][0]+"<span>"+(got[k]?"手に入れた":"まだ")+"</span></a></li>"});h+="</ul>"});
 const others=Object.keys(got).filter(k=>T[k]&&BAG[0][1].indexOf(k)<0&&BAG[1][1].indexOf(k)<0);if(others.length){h+="<h3>旅でふれたもの</h3><ul>";others.forEach(k=>{h+='<li><a href="'+T[k][1]+'" target="_blank" rel="noopener" data-k="'+k+'" translate="no">'+T[k][0]+"</a></li>"});h+="</ul>"}
 $("bagL").innerHTML=h;document.querySelectorAll("#bagL a[data-p]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();bag.classList.remove("show");open(byId(a.dataset.p))}));document.querySelectorAll("#bagL a[data-k]").forEach(a=>a.addEventListener("click",()=>{got[a.dataset.k]=1;save();setTimeout(renderBag,50);veils()}))}
bB.addEventListener("click",()=>{const o=!bag.classList.contains("show");bag.classList.toggle("show",o);bB.setAttribute("aria-expanded",o);if(o)renderBag()});
bag.querySelector(".cl").addEventListener("click",()=>{bag.classList.remove("show");bB.setAttribute("aria-expanded","false")});
$("bHome").addEventListener("click",()=>open(byId("forest")));
addEventListener("keydown",e=>{if(e.key==="Escape"){close();bag.classList.remove("show")}});
if(EMB){$("tag").target="_top";document.documentElement.classList.add("embed")}

/* ---- 碧（場所から場所へ歩いて旅をする）と道具の 3D は、最初の絵のあとで読む */
let halo=null,AM=null,aoiG=null,AW=null;const AS=3;   // 碧はデフォルメで少し大きく（場所の中の旅人として見えるように）
let leg=0,wp=0,wait=3;
function nextGoal(){const L=ROUTE[leg][1];if(wp>=L.length){leg=(leg+1)%ROUTE.length;wp=0;wait=4;return null}return L[wp]}
async function late(){
 const [{GLTFLoader},{MeshoptDecoder}]=await Promise.all([import("three/addons/loaders/GLTFLoader.js"),import("three/addons/libs/meshopt_decoder.module.js")]);
 const ld=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
 PEDS.forEach(d=>ld.loadAsync("/x/02/qlens/p-tools/"+d.k+".glb").then(g=>{const o=g.scene,b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();b.getSize(s);const k=1.7/Math.max(s.x,s.y,s.z);o.scale.setScalar(k);b.setFromObject(o);const c=b.getCenter(new THREE.Vector3());o.position.sub(c);const w=new THREE.Group();w.add(o);w.position.set(d.x,d.y+.9,d.z);o.traverse(m=>{if(m.isMesh)m.castShadow=true});S.add(w);d.obj=w}).catch(()=>{}));
 try{const [buf,V,{AoiMotion}]=await Promise.all([fetch("/x/02/assets/aoi/aoi.vrm").then(r=>r.ok?r.arrayBuffer():Promise.reject(r.status)),import("@pixiv/three-vrm"),import("/x/10/kit/aoi_motion.js")]);
  const l2=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);l2.register(p=>new V.VRMLoaderPlugin(p));const g=await l2.parseAsync(buf,""),v=g.userData.vrm;
  V.VRMUtils.removeUnnecessaryVertices(g.scene);(V.VRMUtils.combineSkeletons??V.VRMUtils.removeUnnecessaryJoints)?.(g.scene);V.VRMUtils.rotateVRM0(v);
  v.scene.traverse(o=>{o.frustumCulled=false;if(o.isMesh)o.castShadow=true});v.humanoid.resetNormalizedPose();v.update(0);v.scene.updateMatrixWorld(true);
  const bx=new THREE.Box3().setFromObject(v.scene),hh=bx.max.y-bx.min.y,sc=hh>.5?1.62/hh:1;v.scene.scale.setScalar(sc);v.scene.position.y=-bx.min.y*sc;
  AW=new THREE.Group();AW.scale.setScalar(AS);S.add(AW);aoiG=new THREE.Group();aoiG.add(v.scene);AW.add(aoiG);
  const f=byId("forest"),sx=f.x+4,sz=f.z+2;aoiG.position.set(sx/AS,H(sx,sz)/AS,sz/AS);
  halo=new THREE.Mesh(new THREE.RingGeometry(1.1,1.5,40),new THREE.MeshBasicMaterial({color:0x9ff0f6,transparent:true,opacity:.55,depthWrite:false}));halo.rotation.x=-Math.PI/2;S.add(halo);AM=new AoiMotion(v,{root:aoiG,reducedMotion:RM,wind:.3,startCalm:2,posture:"natural",uprightWeight:.25,faceLight:.5});AM.place(sx/AS,sz/AS,0);
 }catch(e){console.warn("碧の姿を読み込めませんでした",e?.message??e)}}
setTimeout(()=>late().catch(e=>console.warn(e)),350);
function aoiStep(dt){if(!AM)return;const p=AM.pos;let wx=p.x*AS,wz=p.z*AS;
 if(wait>0){wait-=dt;AM.walkTo(null)}else{let g=nextGoal();while(g&&Math.hypot(g.x-wx,g.z-wz)<1.6){wp++;g=nextGoal()}if(g)AM.walkTo(new THREE.Vector3(g.x/AS,0,g.z/AS));else AM.walkTo(null)}
 AM.pos.y=aoiG.position.y=H(wx,wz)/AS;halo.position.set(wx,H(wx,wz)+.15,wz);AM.lookAt(wait>0?cam.position.clone().divideScalar(AS):null);AM.update(dt,cam)}

/* ---- まわす */
resize();addEventListener("resize",()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,100)});
const clk=new THREE.Clock();let t=0;
function loop(){const dt=Math.min(.05,clk.getDelta());t+=dt;
 if(want){const k=Math.min(1,(performance.now()-want.t0)/900),e=1-Math.pow(1-k,3);tgt.lerpVectors(want.f.t,want.t,e);dist=want.f.d+(want.d-want.f.d)*e;if(k>=1)want=null}
 else if(!dn&&!sel&&!RM)az+=dt*.012;
 setCam();S.fog.near=dist*.9;S.fog.far=dist*2.4+60;
 if(!RM){mists.forEach((m,i)=>{m.position.x+=Math.sin(t*.05+i)*.004});net.forEach((n,i)=>n.material.color.setHSL(.5,.7,.62+Math.sin(t*2+i)*.12));recs.forEach((r,i)=>{const s=1+((t*.4+i/7)%1)*.8;r.scale.set(s,s,s);r.material.opacity=1-((t*.4+i/7)%1)});far.userData.ring.rotation.x=t*.4;far.userData.ring.rotation.y=t*.25;PEDS.forEach((d,i)=>{if(d.obj){d.obj.rotation.y=t*.4+i;d.obj.position.y=d.y+.9+Math.sin(t*1.2+i)*.12}})}
 aoiStep(dt);R.render(S,cam);labels();requestAnimationFrame(loop)}
loop();window.__qw={S,cam,R,aoi:()=>AM&&{x:AM.pos.x*AS,z:AM.pos.z*AS},look:(x,z,d)=>{want=null;tgt.set(x,H(x,z),z);dist=d}};
</script>
