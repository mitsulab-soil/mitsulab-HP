<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="tdm-reservation" content="1">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualia/sight — 今ここ</title>
<meta name="description" content="スマホのカメラが映す今この場所を、犬・ミツバチ・ハエの見え方の模式に、その場で切りかえる。">
<style>
:root{--bg:#0f1412;--ink:#eef2ea;--dim:#aab7ad;--line:#33443b;--aoi:#4fb3a8;
--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--goth:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--goth);-webkit-text-size-adjust:100%}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:3;background:linear-gradient(#0f1412cc,#0f141200)}
header a{color:var(--ink);text-decoration:none;font-size:20px;min-width:44px;min-height:44px;display:grid;place-items:center}
header b{font-family:var(--mincho);font-weight:600;letter-spacing:.06em;font-size:17px}
header small{color:var(--dim);font-size:12px}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:4;background:var(--bg)}
#start button{font-family:var(--mincho);font-size:18px;letter-spacing:.08em;color:var(--ink);background:none;border:1px solid var(--aoi);border-radius:999px;padding:14px 28px;min-height:48px;cursor:pointer}
#start p{color:var(--dim);font-size:13px;text-align:center;margin:14px 16px 0;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;padding:10px 10px calc(12px + env(safe-area-inset-bottom));z-index:3;background:linear-gradient(#0f141200,#0f1412dd)}
nav button{flex:1;max-width:120px;min-height:48px;font-family:var(--mincho);font-size:15px;color:var(--ink);background:#0f141299;border:1px solid var(--line);border-radius:12px;cursor:pointer}
nav button[aria-pressed=true]{border-color:var(--aoi);color:#fff;box-shadow:inset 0 0 0 1px var(--aoi)}
#cap{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:3;text-align:center;font-size:13px;line-height:1.6;color:var(--ink);text-shadow:0 1px 3px #000,0 0 8px #000;margin:0}
#cap small{display:block;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<canvas id="cv" aria-label="カメラの映像を、選んだ生き物の見え方の模式に変えて映す画面"></canvas>
<header><a href="./" aria-label="Qualia/sight の森へ戻る">←</a><b>Qualia/sight</b><small>今ここ</small></header>
<div id="start"><div><button id="go" type="button">カメラをひらく</button><p>映像は端末の中だけで変えます。<br>保存も送信もしません。</p></div></div>
<nav aria-label="見え方">
<button data-m="0" aria-pressed="true">人</button><button data-m="1" aria-pressed="false">犬</button><button data-m="2" aria-pressed="false">ミツバチ</button><button data-m="3" aria-pressed="false">ハエ</button>
</nav>
<p id="cap" aria-live="polite" role="status"></p>
<video id="v" playsinline muted hidden></video>
<script>
(()=>{
const CAP=[
 ['人の目。赤・緑・青の三つの錐体で見ている。',''],
 ['犬の目の模式。錐体は二種類（よく応える光は約 429 nm と 555 nm）で、赤と緑の区別がつきにくい。細かいところは人よりぼやける。','Neitz, Geist & Jacobs 1989 Visual Neuroscience 3:119／Miller & Murphy 1995 JAVMA 207:1623'],
 ['ミツバチの目の模式。受けとるのは紫外・青・緑（約 344・436・544 nm）で、赤は暗く沈む。見分けられる細かさは人のおよそ百分の一とされる（画面の粒は模式）。紫外線はカメラに写らないため描けない。','Peitsch et al. 1992 J Comp Physiol A 170:23／Srinivasan & Lehrer 1988 J Comp Physiol A 162:159'],
 ['ハエの目の模式。速く飛ぶハエの視細胞は、光の変化に約 50〜107 Hz まで応じる（夜のガガンボは 16〜19 Hz）。ここでは、動いたものほど浮かぶ形で表す。','Laughlin & Weckström 1993 J Comp Physiol A 172:593']
];
const cv=document.getElementById('cv'),v=document.getElementById('v'),cap=document.getElementById('cap');
const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
let mode=0,src=null;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const vs='attribute vec2 p;varying vec2 u;void main(){u=p*.5+.5;gl_Position=vec4(p,0,1);}';
const fs=`precision mediump float;varying vec2 u;uniform sampler2D cur,prev;uniform int m;uniform vec2 res,vres;
vec2 cover(vec2 q){float a=res.x/res.y,b=vres.x/vres.y;vec2 s=a>b?vec2(1.,b/a):vec2(a/b,1.);return vec2((q.x-.5)*s.x+.5,1.-((q.y-.5)*s.y+.5));}
vec3 t(vec2 q){return texture2D(cur,cover(q)).rgb;}
vec3 blur(vec2 q,float r){vec3 c=vec3(0);for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++)c+=t(q+vec2(float(i),float(j))*r/res);return c/25.;}
void main(){vec3 c=t(u);
if(m==1){c=blur(u,2.2);
 // 二色型の模式（Viénot 1999 の第二色覚の近似。L と M を一つにまとめる）
 float lm=dot(c,vec3(.45,.55,0.));c=vec3(lm*.95,lm*.92,c.b*.9+lm*.08);}
else if(m==2){vec2 cell=vec2(48.*res.x/res.y,48.);vec2 q=(floor(u*cell)+.5)/cell;c=blur(q,3.);
 // ミツバチの錐体は紫外・青・緑。赤の帯はほとんど受けない
 float g=c.g,b=c.b;c=vec3(g*.15,g*.85+b*.1,b*.95);
 vec2 f=fract(u*cell)-.5;c*=1.-smoothstep(.36,.5,length(f))*.35;}
else if(m==3){vec3 p=texture2D(prev,cover(u)).rgb;float d=length(c-p);float l=dot(c,vec3(.3,.59,.11));c=vec3(l*.45)+vec3(.85,.95,.9)*smoothstep(.04,.25,d);}
gl_FragColor=vec4(c,1);}`;
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
function tex(){const x=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,x);for(const [k,w] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,w);return x}
const T=[tex(),tex()];let ti=0;
gl.uniform1i(gl.getUniformLocation(pr,'cur'),0);gl.uniform1i(gl.getUniformLocation(pr,'prev'),1);
const uM=gl.getUniformLocation(pr,'m'),uR=gl.getUniformLocation(pr,'res'),uV=gl.getUniformLocation(pr,'vres');
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',size);size();
function frame(){if(src&&src.videoWidth){ti^=1;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,T[ti]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,T[ti^1]);
 gl.uniform1i(uM,mode);gl.uniform2f(uR,cv.width,cv.height);gl.uniform2f(uV,src.videoWidth,src.videoHeight);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
 requestAnimationFrame(frame)}
function setM(i){mode=i;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==i));cap.innerHTML=CAP[i][0]+(CAP[i][1]?'<small>出典：'+CAP[i][1]+'</small>':'')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setM(+b.dataset.m));
setM(0);
document.getElementById('go').onclick=async()=>{
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});v.srcObject=s;await v.play();src=v;document.getElementById('start').remove();}
 catch(e){document.querySelector('#start p').textContent='カメラをひらけませんでした。設定でカメラを許可してから、もう一度押してください。';}
};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
