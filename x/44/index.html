<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="スマホが受けとる地磁気の方位（磁北）を、音のうなりで感じる。">
<meta name="tdm-reservation" content="1">
<title>Qualia/magnet</title>
<style>
:root{--bg:#0d1214;--ink:#e6ece8;--sub:#8fa39c;--line:#2c3a37;--acc:#7fc4b4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));overflow:hidden}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;font-size:13px;color:var(--sub);letter-spacing:.08em}
#dial{width:min(72vw,320px);aspect-ratio:1;position:relative}
#dial svg{width:100%;height:100%}
#read{text-align:center;min-height:64px}
#deg{font-size:34px;letter-spacing:.04em}
#uT{font-size:13px;color:var(--sub);margin-top:4px}
#note{font-size:12px;color:var(--sub);text-align:center;max-width:340px;line-height:1.7;min-height:40px}
.row{display:flex;gap:10px;width:100%;max-width:480px}
button{flex:1;min-height:52px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit;font-size:15px;letter-spacing:.1em}
button.on{border-color:var(--acc);color:var(--acc)}
#more{font-size:12px;color:var(--sub);max-width:340px;text-align:center;line-height:1.7}
#more summary{list-style:none;cursor:pointer;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--sub)}
#more summary::-webkit-details-marker{display:none}
#more[open] summary{color:var(--acc)}
#more p{text-align:left}
#pocket{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;color:#333;font-size:13px;letter-spacing:.1em}
#pocket.show{display:flex}#pocket span{max-width:300px;text-align:center;line-height:1.9;color:#6f817b;font-size:14px}
</style>
</head>
<body>
<header><span>mitsulab</span><span>Qualia/magnet</span></header>
<div id="dial" aria-label="北の向き">
<svg viewBox="-100 -100 200 200">
 <circle r="92" fill="none" stroke="#2c3a37" stroke-width="1"/>
 <g id="ticks"></g>
 <g id="needle"><line x1="0" y1="-10" x2="0" y2="-84" stroke="#7fc4b4" stroke-width="2"/><text x="0" y="-62" fill="#7fc4b4" font-size="12" text-anchor="middle" dx="12">北</text></g>
 <line x1="0" y1="-96" x2="0" y2="-88" stroke="#e6ece8" stroke-width="2"/>
</svg>
</div>
<svg id="trail" viewBox="-60 -60 120 120" style="display:none;width:min(60vw,240px);height:min(60vw,240px)" aria-label="歩いたあいだに北がどう回ったか"></svg>
<div id="read"><div id="deg">―</div><div id="uT"></div></div>
<p id="note">触れると、北の向きが音になります。<br>イヤホン推奨。</p>
<details id="more"><summary aria-label="生き物の磁気の感覚について">＋</summary><p>ヨーロッパコマドリは、渡りの向きを決めるときに地磁気を手がかりにしていると考えられています（Wiltschko &amp; Wiltschko 1972, <i>Science</i> 176:62–64）。どのように感じているかは、まだ分かっていないことが多くあります。この音は、スマホの磁気センサーの方位を人の耳に移した模式です。</p></details>
<div class="row"><button id="start">はじめる</button><button id="pk" disabled>ポケットへ</button></div>
<div id="pocket"><span>画面を暗くしました。<br>耳と体で、北を探して。<br>触れると戻る</span></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ticks=$('ticks');for(let i=0;i<36;i++){const a=i*10*Math.PI/180,r1=i%9?88:82;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',Math.sin(a)*r1);l.setAttribute('y1',-Math.cos(a)*r1);l.setAttribute('x2',Math.sin(a)*92);l.setAttribute('y2',-Math.cos(a)*92);l.setAttribute('stroke','#2c3a37');ticks.appendChild(l)}
let log=[],t0s=0,finds=0,W=40,ctx,pan,gain,filt,toneG,oA,oB,running=false,heading=null,sm=null,field=null,lastVib=0,inN=false,hasVib='vibrate' in navigator;
const ios=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
function audio(){
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 // 地の音：やわらかい風のようなノイズ。長く聴いても疲れないよう小さく、高い所を落とす
 const len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let b=0;
 for(let i=0;i<len;i++){b=(b+0.02*(Math.random()*2-1))/1.02;d[i]=b*3.5}
 const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
 filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=500;filt.Q.value=.7;
 gain=ctx.createGain();gain.gain.value=0;
 pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
 const bus=ctx.createGain();bus.gain.value=1;
 src.connect(filt);filt.connect(gain);gain.connect(bus);
 // 北の手がかり：近い高さの二つの音。北からずれるほど「うなり」が速く、北（磁北）で止まって一つの澄んだ音になる
 oA=ctx.createOscillator();oB=ctx.createOscillator();oA.type=oB.type='sine';oA.frequency.value=392;oB.frequency.value=392;
 toneG=ctx.createGain();toneG.gain.value=0;oA.connect(toneG);oB.connect(toneG);toneG.connect(bus);
 (pan?bus.connect(pan).connect(ctx.destination):bus.connect(ctx.destination));
 src.start();oA.start();oB.start();
}
function chime(){const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=784;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);o.connect(g).connect(pan||ctx.destination);o.start(t);o.stop(t+1.3)}
function update(){
 if(heading==null||!ctx||!running)return;
 // 手の揺れでちらつかないよう、向きをなめらかにする（円の上で）
 if(sm==null)sm=heading;else{const df=((heading-sm+540)%360)-180;sm=(sm+df*.25+360)%360}
 const h=sm;let rel=((-h+540)%360)-180; // 北が自分から見てどちらか（0＝正面）
 $('needle').setAttribute('transform','rotate('+(-h)+')');
 $('deg').textContent=Math.round(h)+'°';
 if(!log.length||Date.now()-log[log.length-1][0]>1000)log.push([Date.now(),h]);
 const t=ctx.currentTime,front=Math.cos(rel*Math.PI/180),ar=Math.abs(rel);
 if(pan)pan.pan.setTargetAtTime(Math.sin(rel*Math.PI/180)*.8,t,.08);
 // 正面ほど明るく、背にあるほどこもる
 filt.frequency.setTargetAtTime(260+(front+1)*260,t,.15);
 gain.gain.setTargetAtTime(.07+.05*Math.max(0,front),t,.15);
 // うなり：1° ずれると 0.15 回／秒、10° で 1.5 回／秒。±40° より外では鳴らさない
 oB.frequency.setTargetAtTime(392+Math.min(ar,W)*.15,t,.05);
 toneG.gain.setTargetAtTime(ar<W?.05*Math.pow(1-ar/W,1.5):0,t,.12);
 if(ar<4&&!inN){inN=true;finds++;if(finds==3){W=25;$('note').textContent='北の音を細くしました。耳より先に、体で北を探してみて。'}$('deg').style.color='var(--acc)';if(finds==1&&!$('pocket').classList.contains('show'))$('note').textContent='碧：顔を上げて。いま向いている北（磁北）の先に、実際には何がある？';if(Date.now()-lastVib>2000){lastVib=Date.now();chime();if(hasVib)navigator.vibrate(18)}}
 else if(ar>9&&inN){inN=false;$('deg').style.color=''}
}
function onOri(e){
 let h=null;
 if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
 else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;
 if(h==null)return;heading=h;update();
}
function mag(){
 if(!('Magnetometer' in window)){return}
 try{const m=new Magnetometer({frequency:10});m.onreading=()=>{field=Math.hypot(m.x,m.y,m.z);$('uT').textContent='強さ '+field.toFixed(0)+' µT'};m.onerror=()=>{$('uT').textContent=''};m.start()}catch(_){$('uT').textContent=''}
}
$('start').onclick=async()=>{
 if(running){running=false;showTrail();gain&&gain.gain.setTargetAtTime(0,ctx.currentTime,.1);toneG&&toneG.gain.setTargetAtTime(0,ctx.currentTime,.1);$('start').textContent='はじめる';$('start').classList.remove('on');$('pk').disabled=true;return}
 if(!ctx)audio();await ctx.resume();
 if(ios){try{if(await DeviceOrientationEvent.requestPermission()!=='granted'){$('note').textContent='向きの許可がないため、使えません。';return}}catch(_){ $('note').textContent='向きの許可を得られませんでした。';return}}
 window.addEventListener('deviceorientationabsolute',onOri);window.addEventListener('deviceorientation',onOri);
 mag();running=true;clearTimeout(window.__pkT);window.__pkT=setTimeout(()=>{if(running&&heading!=null)$('pk').onclick()},25000);log=[];finds=0;W=40;t0s=Date.now();$('trail').style.display='none';$('dial').style.display='';$('start').textContent='とめる';$('start').classList.add('on');$('pk').disabled=false;
 $('note').innerHTML='北が右なら右の耳から。北に近づくと音がうなり、<br>北（磁北）を向くとうなりが止まり、小さな鈴が一度鳴ります。';
 setTimeout(()=>{if(heading==null)$('note').textContent='方位が取れません。スマホで開いてください。'},2500);
};
function showTrail(){
 if(log.length<5){$('note').textContent='短すぎて、北の回り方を描けませんでした。少し歩きながら聴いてみてください。';return}const sv=$('trail'),n=log.length;let p='';
 log.forEach(([,h],i)=>{const r=12+40*i/(n-1),a=-h*Math.PI/180;p+=(i?'L':'M')+(Math.sin(a)*r).toFixed(1)+' '+(-Math.cos(a)*r).toFixed(1)});
 sv.innerHTML='<circle r="58" fill="none" stroke="#2c3a37"/><path d="'+p+'" fill="none" stroke="#7fc4b4" stroke-width="1.4" stroke-linecap="round"/><text y="4" fill="#8fa39c" font-size="9" text-anchor="middle">はじめ</text>';
 $('dial').style.display='none';sv.style.display='';
 const m=Math.round((Date.now()-t0s)/60000);
 $('note').innerHTML='線は、北が自分から見てどちらにあったか（中心がはじめ、外ほどあと'+(m?'・'+m+' 分':'')+'）。北を見つけたのは '+finds+' 回。<br>碧：閉じたあと、いつもの道で北がどちらか、思い出してみて。'+(W<40?'途中から手がかりを細くしました。':'')+'<br>記録はこの画面だけで、閉じると消えます。';
 if(window.atosaki)setTimeout(()=>window.atosaki('いま、画面を見ずに北を指せる？',[{n:'指せる',s:'meas',t:'機器が測った北を音で聴いたあと、体で北を指せた'},{n:'だいたい',s:'meas',t:'機器が測った北を音で聴いたあと、北がだいたい分かった'},{n:'まだ',s:'meas',t:'機器が測った北を音で聴いたあとも、北はまだ分からない'}]),1500);
}
$('pk').onclick=()=>{$('pocket').classList.add('show');navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})};
$('pocket').onclick=()=>$('pocket').classList.remove('show');
})();
</script>
<script src="../39/atosaki.js" defer></script>
</body>
</html>
