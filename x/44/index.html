<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="スマホが受けとる地磁気の方位を、音と振動で感じる。">
<meta name="tdm-reservation" content="1">
<title>Qualia/magnet</title>
<style>
:root{--bg:#0d1214;--ink:#e6ece8;--sub:#8fa39c;--line:#2c3a37;--acc:#7fc4b4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));overflow:hidden}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;font-size:13px;color:var(--sub);letter-spacing:.08em}
#dial{width:min(72vw,320px);aspect-ratio:1;position:relative}
#dial svg{width:100%;height:100%}
#read{text-align:center;min-height:64px}
#deg{font-size:34px;letter-spacing:.04em}
#uT{font-size:13px;color:var(--sub);margin-top:4px}
#note{font-size:12px;color:var(--sub);text-align:center;max-width:340px;line-height:1.7;min-height:40px}
.row{display:flex;gap:10px;width:100%;max-width:480px}
button{flex:1;min-height:52px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit;font-size:15px;letter-spacing:.1em}
button.on{border-color:var(--acc);color:var(--acc)}
#pocket{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;color:#333;font-size:13px;letter-spacing:.1em}
#pocket.show{display:flex}
</style>
</head>
<body>
<header><span>mitsulab</span><span>Qualia/magnet</span></header>
<div id="dial" aria-label="北の向き">
<svg viewBox="-100 -100 200 200">
 <circle r="92" fill="none" stroke="#2c3a37" stroke-width="1"/>
 <g id="ticks"></g>
 <g id="needle"><line x1="0" y1="-10" x2="0" y2="-84" stroke="#7fc4b4" stroke-width="2"/><text x="0" y="-62" fill="#7fc4b4" font-size="12" text-anchor="middle" dx="12">北</text></g>
 <line x1="0" y1="-96" x2="0" y2="-88" stroke="#e6ece8" stroke-width="2"/>
</svg>
</div>
<div id="read"><div id="deg">―</div><div id="uT"></div></div>
<p id="note">触れると、北の向きが音になります。<br>イヤホン推奨。</p>
<div class="row"><button id="start">はじめる</button><button id="pk" disabled>ポケットへ</button></div>
<div id="pocket">触れると戻る</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ticks=$('ticks');for(let i=0;i<36;i++){const a=i*10*Math.PI/180,r1=i%9?88:82;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',Math.sin(a)*r1);l.setAttribute('y1',-Math.cos(a)*r1);l.setAttribute('x2',Math.sin(a)*92);l.setAttribute('y2',-Math.cos(a)*92);l.setAttribute('stroke','#2c3a37');ticks.appendChild(l)}
let ctx,pan,gain,filt,lfoG,running=false,heading=null,field=null,lastVib=0,hasVib='vibrate' in navigator;
const ios=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
function audio(){
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 // 自然な音色：やわらかい風のようなノイズを帯域でしぼる
 const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let b=0;
 for(let i=0;i<len;i++){b=(b+0.02*(Math.random()*2-1))/1.02;d[i]=b*3.5}
 const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
 filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=520;filt.Q.value=4;
 gain=ctx.createGain();gain.gain.value=0;
 pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
 src.connect(filt);filt.connect(gain);(pan?gain.connect(pan).connect(ctx.destination):gain.connect(ctx.destination));
 src.start();
}
function update(){
 if(heading==null||!ctx)return;
 // rel：北が自分から見てどちらか（-180..180、0＝正面）
 let rel=((-heading+540)%360)-180;
 $('needle').setAttribute('transform','rotate('+(-heading)+')');
 $('deg').textContent=Math.round(heading)+'°';
 const t=ctx.currentTime,front=Math.cos(rel*Math.PI/180);
 if(pan)pan.pan.setTargetAtTime(Math.sin(rel*Math.PI/180),t,.08);
 // 正面に北が来るほど澄んで少し大きく、背にあると低く遠い
 filt.frequency.setTargetAtTime(380+front*260+(field?Math.min(field,70)*2:0),t,.1);
 gain.gain.setTargetAtTime(.18+.14*Math.max(0,front),t,.1);
 if(hasVib&&Math.abs(rel)<12&&Date.now()-lastVib>1500){navigator.vibrate(18);lastVib=Date.now()}
}
function onOri(e){
 let h=null;
 if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
 else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;
 if(h==null)return;heading=h;update();
}
function mag(){
 if(!('Magnetometer' in window)){$('uT').textContent='強さ：この端末では取れません（方位のみ）';return}
 try{const m=new Magnetometer({frequency:10});m.onreading=()=>{field=Math.hypot(m.x,m.y,m.z);$('uT').textContent='強さ '+field.toFixed(0)+' µT'};m.onerror=()=>{$('uT').textContent='強さ：取れません（方位のみ）'};m.start()}catch(_){$('uT').textContent='強さ：取れません（方位のみ）'}
}
$('start').onclick=async()=>{
 if(running){running=false;gain&&gain.gain.setTargetAtTime(0,ctx.currentTime,.1);$('start').textContent='はじめる';$('start').classList.remove('on');$('pk').disabled=true;return}
 if(!ctx)audio();await ctx.resume();
 if(ios){try{if(await DeviceOrientationEvent.requestPermission()!=='granted'){$('note').textContent='向きの許可がないため、使えません。';return}}catch(_){ $('note').textContent='向きの許可を得られませんでした。';return}}
 window.addEventListener('deviceorientationabsolute',onOri);window.addEventListener('deviceorientation',onOri);
 mag();running=true;$('start').textContent='とめる';$('start').classList.add('on');$('pk').disabled=false;
 $('note').innerHTML='北が右にあれば右の耳、正面なら澄んだ音。'+(hasVib?'<br>正面に北が来ると小さく震えます。':'<br>この端末は振動できないため、音だけで伝えます。');
 setTimeout(()=>{if(heading==null)$('note').textContent='方位が取れません。スマホで開いてください。'},2500);
};
$('pk').onclick=()=>{$('pocket').classList.add('show');navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})};
$('pocket').onclick=()=>$('pocket').classList.remove('show');
})();
</script>
</body>
</html>
