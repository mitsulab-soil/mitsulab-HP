<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qualium まなざし</title>
<meta name="robots" content="noindex,noai,noimageai">
<meta name="tdm-reservation" content="1">
<link rel="stylesheet" href="web/tokens.css">
<script type="importmap">{"imports":{"three":"./web/hikawa-runtime-170-355.js"}}</script>

<style>
html,body{margin:0;height:100%;background:var(--ml-bg);color:var(--ml-ink);font-family:var(--ml-serif);overflow:hidden;-webkit-text-size-adjust:100%}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:1px solid var(--ml-aoi-2);outline-offset:2px}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:center;gap:6px;z-index:5}
#brand{font-family:var(--ml-latin);font-size:15px;letter-spacing:.12em;color:var(--ml-ink-2);margin-right:auto;white-space:nowrap}
.tb{min-height:44px;padding:0 11px;white-space:nowrap;display:flex;align-items:center;font-size:13px;letter-spacing:.06em;color:var(--ml-ink-2);border:1px solid var(--ml-line-weak);border-radius:22px;background:rgba(8,13,22,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tb[aria-pressed="true"]{color:#0b1119;background:var(--ml-aoi-2)}
#sub{position:fixed;left:16px;right:16px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 218px);text-align:center;font-size:14px;line-height:1.7;letter-spacing:.06em;color:var(--ml-ink);text-shadow:0 1px 8px #000,0 0 2px #000;z-index:4;pointer-events:none;transition:opacity .5s}
#sub b{font-weight:500;color:var(--ml-aoi-2)}
#q{position:fixed;left:16px;right:16px;top:calc(max(10px,env(safe-area-inset-top)) + 54px);text-align:center;font-size:18px;letter-spacing:.08em;line-height:1.6;z-index:4;color:var(--ml-ink);text-shadow:0 1px 10px #000}
#q small{display:block;font-size:11px;color:var(--ml-ink-3);letter-spacing:.14em}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100% - 32px,420px)}
.row{display:flex;gap:2px;padding:4px;border-radius:30px;background:rgba(8,13,22,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(225,235,242,.14);max-width:100%}
.row button{width:52px;min-height:48px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(232,239,244,.78);font-size:10.5px;letter-spacing:.06em}
.row button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.row button[aria-pressed="true"]{color:#0b1119;background:radial-gradient(120% 100% at 50% 20%,#fbfcfd,color-mix(in oklab,var(--c) 45%,#eef3f5))}
#who button{width:auto;padding:0 10px;font-size:12px;flex-direction:row}
#act{display:flex;gap:14px;align-items:center}
.big{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;letter-spacing:.08em;color:var(--ml-ink);border:1px solid rgba(255,255,255,.55);background:rgba(8,13,22,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.big svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3}
.big.rec{border-color:#f4aa96;color:#f4aa96}
#cnt{font-family:var(--ml-mono);font-size:11px;color:var(--ml-ink-3);min-width:40px;text-align:center}
#win{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(3,6,15,.55)}
#win.on{display:flex}
#vw{width:min(78vw,360px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid var(--ml-aoi-2);box-shadow:0 0 40px rgba(92,200,224,.25);position:relative;background:#000}
#vw canvas{width:100%;height:100%;display:block}
#vlab{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:11px;letter-spacing:.12em;color:#fff;text-shadow:0 0 6px #000}
#winb{display:flex;gap:14px}
#file{display:none}
#cr{position:fixed;right:8px;bottom:2px;z-index:3;font-size:9px;letter-spacing:.04em;color:var(--ml-ink-3);opacity:.7;pointer-events:none}
#drop{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;font-size:20px;background:rgba(3,6,15,.8);border:2px dashed var(--ml-aoi-2)}
#drop.on{display:flex}
@media (max-width:440px){#brand{display:none}#top{justify-content:flex-end}#q{top:calc(max(10px,env(safe-area-inset-top)) + 58px);font-size:16px}}
@media (min-width:900px){#q{font-size:24px}#sub{font-size:16px}}
</style>
</head>
<body>
<script src="loader/loader.js"></script>
<canvas id="c" aria-label="みんなの層を重ねた 3D の空間"></canvas>
<div id="top">
  <div id="brand">Qualium まなざし</div>
  <button class="tb" id="bView" aria-pressed="false">並べる</button>
  <button class="tb" id="bGive">渡す</button>
  <button class="tb" id="bTake">受けとる</button>
</div>
<div id="q"><small>碧の問い</small><span id="qt"></span></div>
<div id="sub"></div>
<div id="cr">© mitsulab ・ 声 VOICEVOX:冥鳴ひまり</div>
<div id="dock">
  <div class="row" id="who" aria-label="だれの受けとり方で"></div>
  <div class="row" id="sense" aria-label="どの感覚で"></div>
  <div id="act">
    <span id="cnt"></span>
    <button class="big" id="bShot" aria-label="撮る"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M4 8h3l2-3h6l2 3h3v11H4z"/></svg>撮る</button>
    <button class="big" id="bRec" aria-label="録る"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>録る</button>
    <span id="cnt2" style="min-width:40px"></span>
  </div>
</div>
<div id="win">
  <div id="vw"><canvas id="vc" width="720" height="720"></canvas><div id="vlab"></div></div>
  <div id="winb"><button class="big" id="bSnap">残す</button><button class="big" id="bCancel">やめる</button></div>
</div>
<input type="file" id="file" multiple accept=".json,.qualia,application/json">
<input type="file" id="pic" accept="image/*" capture="environment" style="display:none">
<div id="drop">層のファイルを、ここに置く</div>
<script type="module" src="web/app.js"></script>
</body>
</html>
