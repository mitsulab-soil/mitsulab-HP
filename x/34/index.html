<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qualia/fable</title>

<style>
:root{
  --bg:#04070f;--ink:#eef5fb;--ink3:#8f9bb4;--aoi:#5cc8e0;
  --sumi:#2a2622;--sumi2:#5b544b;--sumi3:#8a8174;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --mono:ui-monospace,Menlo,monospace;--ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-text-size-adjust:100%}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:baseline;z-index:5;pointer-events:none}
header .back{pointer-events:auto;display:inline-flex;align-items:center;min-width:44px;min-height:44px;margin:-12px 10px -12px -6px;padding:0 6px;color:var(--ink,#eef1f6);text-decoration:none;font-size:14px;letter-spacing:.06em}header .back:focus-visible{outline:2px solid var(--aoi)}
header h1{font-size:15px;font-weight:500;letter-spacing:.08em}
header h1 i{font-family:"Cormorant Garamond",serif;color:var(--ink3);font-weight:400}
header span{font-family:var(--mono);font-size:10px;color:var(--ink3)}
#sub{position:fixed;left:16px;right:16px;top:64px;text-align:center;font-size:14px;line-height:1.9;letter-spacing:.08em;color:var(--ink);transition:opacity .8s;pointer-events:none}
#sub small{display:block;font-size:12px;color:var(--ink3)}
/* 灯：参道のあちこちに散らばる（中心は置かない） */
.lt:focus:not(:focus-visible){outline:none}
.lt{position:fixed;transform:translate(-50%,-11px);min-width:44px;min-height:44px;padding:6px 4px;border:0;background:transparent;color:var(--ink);font:15px var(--serif);letter-spacing:.08em;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:4}
.lt i{width:12px;height:12px;border-radius:50%;background:#f2cf8c;box-shadow:0 0 12px 3px rgba(242,207,140,.45);animation:br 4.8s ease-in-out infinite}
.lt i{background:color-mix(in srgb,var(--c) 82%,#3a2a20);box-shadow:0 0 10px 2px color-mix(in srgb,var(--c) 30%,transparent)}.lt{text-shadow:0 1px 6px #000}
.lt.read i{background:transparent;box-shadow:inset 0 0 0 1px rgba(242,207,140,.6);animation:none}
.lt.read{color:var(--ink3)}.lt ruby rt{font-size:9px;letter-spacing:0}.lt span{text-shadow:0 0 4px #000,0 1px 8px #000,0 0 14px rgba(0,0,0,.8)}
.lt:focus-visible{outline:1px solid var(--aoi);outline-offset:2px}
@keyframes br{0%,100%{opacity:.7}50%{opacity:.92}}
/* 一編 */
#card{position:fixed;left:50%;top:50%;width:min(92vw,460px);max-height:min(84vh,660px);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;
  background:linear-gradient(175deg,#f3ecdd 0%,#e9dfca 100%);color:var(--sumi);border-radius:2px;padding:26px 24px 18px;z-index:10;
  box-shadow:0 30px 60px rgba(0,0,0,.55);transition:transform .6s var(--ease),opacity .5s;overflow:auto;overscroll-behavior:contain}
#card.open{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#card .tag{font-size:11px;color:var(--sumi3);letter-spacing:.2em}
#card h2{margin-top:6px;padding-right:36px;font-size:19px;font-weight:500;letter-spacing:.1em}
#card .body{margin-top:14px;font-size:16px;line-height:2.05;letter-spacing:.04em;white-space:pre-wrap}
#card .end{margin-top:12px;font-size:14px;color:var(--sumi2);line-height:1.9}
#card details{margin-top:12px;font-size:12px;color:var(--sumi3);line-height:1.75}
#card summary{cursor:pointer;min-height:44px;display:flex;align-items:center;list-style:none;color:var(--sumi2)}
#card summary::-webkit-details-marker{display:none}
#card summary::before{content:"＋ "}
#card details[open] summary::before{content:"－ "}
#card details p+p{margin-top:6px}
.row{display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid rgba(90,80,64,.25);padding-top:8px}
.row button,.close{height:44px;min-width:44px;border:0;background:transparent;font:14px var(--serif);color:var(--sumi);cursor:pointer;padding:0 10px}
.close:focus{outline:none}.close:focus-visible{outline:1px solid var(--sumi3)}
.close{position:absolute;right:6px;top:6px;font-size:22px;color:var(--sumi2)}
/* 2026-11-09 第2周：ひらく途中（縮んだ姿）でも 44px を下回らない */#card summary,.row button,.close{min-height:48px;min-width:48px}
#scene,#torii{transition:filter 1s,opacity 1s,fill 1s}
body.fx-bee #torii{fill:#1c1414;filter:none}body.fx-bee #torii *{fill:#1c1414}
body.fx-worm #scene{filter:grayscale(1) brightness(.55)}
body.fx-bat #arcs{opacity:.5}
body.fx-rec #scan{opacity:.18}
body.fx-tick #scene{filter:blur(2px) brightness(.7)}
body.fx-fly #scene{filter:hue-rotate(25deg) saturate(1.4)}
body.fx-leaf #scene{filter:sepia(.5) brightness(.8)}
#arcs,#scan{opacity:0;transition:opacity 1s}
#net{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#net path{fill:none;stroke:#f2cf8c;stroke-width:.8;stroke-linejoin:round;opacity:0;transition:opacity 2.4s}
body.all #net path{opacity:.32}
#veil{position:fixed;inset:0;background:rgba(2,4,10,.32);opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
#veil.on{opacity:1;pointer-events:auto}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 16px max(10px,env(safe-area-inset-bottom));font-size:10px;color:var(--ink3);text-align:center;letter-spacing:.05em;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){#card{top:auto;bottom:0;width:100vw;max-height:38vh;border-radius:6px 6px 0 0;transform:translate(-50%,12%);padding:20px 20px 10px}#card.open{transform:translate(-50%,0)}#card h2{font-size:17px}#card .body{font-size:15px;line-height:1.95}#veil{background:rgba(2,4,10,.12)}}
@media (min-width:900px){#card{left:auto;right:5vw;width:min(36vw,440px);transform:translate(0,-46%) scale(.96)}#card.open{transform:translate(0,-50%) scale(1)}#veil{background:rgba(2,4,10,.15)}}
/* 2026-11-10 第4周：灯は近い（画面の下の）ものほど大きく・名は読める大きさに。参道は手前ほど明るく、敷石の目地が遠くへ詰まる。× は「とじる」と字で */
.lt{font-size:calc(16px + 6px*var(--k,0));gap:calc(5px + 4px*var(--k,0))}
.lt i{width:calc(10px + 10px*var(--k,0));height:calc(10px + 10px*var(--k,0))}
.lt ruby rt{font-size:calc(10px + 2px*var(--k,0))}
.close{width:auto;font-size:15px!important;letter-spacing:.06em;padding:0 12px!important;border:1px solid rgba(90,80,64,.35)!important;border-radius:2px;top:10px!important;right:10px!important}
#card h2{padding-right:96px}
/* 2026-11-10 第5周：札は画面の半分の高さまで（背景の参道が見えるまま）・覆いは薄く */
#card{max-height:min(50vh,520px);overflow:auto}
@media (min-width:900px){#card{top:auto;bottom:4vh;transform:translate(0,4%) scale(.96)}#card.open{transform:translate(0,0) scale(1)}}
@media (max-width:600px){#card{max-height:38vh}}
#veil{background:rgba(2,4,10,.08)!important}
</style>
</head>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060e"/><stop offset=".55" stop-color="#0c1526"/><stop offset="1" stop-color="#131a22"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a28"/><stop offset="1" stop-color="#121413"/></linearGradient>
    <radialGradient id="fog" cx=".5" cy=".56" r=".5"><stop offset="0" stop-color="#2a3a4a" stop-opacity=".55"/><stop offset="1" stop-color="#2a3a4a" stop-opacity="0"/></radialGradient>
  </defs>

  <g id="crowns" fill="#0b1310" opacity=".92"></g><g id="trees0" fill="#1c1a17"></g><g id="trees" fill="url(#bark)" opacity=".62"></g><g id="shade" fill="#000" opacity=".28"></g>
  <linearGradient id="pathL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080f" stop-opacity=".75"/><stop offset=".45" stop-color="#05080f" stop-opacity=".25"/><stop offset="1" stop-color="#f2cf8c" stop-opacity=".10"/></linearGradient>
  <radialGradient id="pool" cx=".5" cy="1" r=".6"><stop offset="0" stop-color="#f2cf8c" stop-opacity=".16"/><stop offset="1" stop-color="#f2cf8c" stop-opacity="0"/></radialGradient>
  <path d="M470 560 L530 560 L760 1000 L240 1000Z" fill="url(#grav)" opacity=".4"/>
  <g id="joints" stroke="#0a0c0c" stroke-opacity=".5" fill="none"></g>

  <!-- 鳥居（遠く・朱） -->
  <g id="torii" transform="translate(500 520)" fill="#b3402c" style="filter:drop-shadow(0 0 6px rgba(214,90,60,.3))"><defs><linearGradient id="tpil" x1="0" x2="1"><stop offset="0" stop-color="#7d2a1d"/><stop offset=".45" stop-color="#c44a31"/><stop offset="1" stop-color="#8a2e20"/></linearGradient></defs><path d="M-40 -7 Q0 -2 40 -7 L38 -3 Q0 1 -38 -3Z" fill="#1d1715"/><path d="M-36 -3 Q0 1 36 -3 L35 1 Q0 4 -35 1Z"/><rect x="-1.6" y="2" width="3.2" height="7"/><rect x="-33" y="9" width="66" height="3.2"/><path d="M-23 1 L-19.6 1 L-19 40 L-23.6 40Z" fill="url(#tpil)"/><path d="M19.6 1 L23 1 L23.6 40 L19 40Z" fill="url(#tpil)"/><rect x="-24.4" y="37" width="6" height="4" fill="#1d1715"/><rect x="18.4" y="37" width="6" height="4" fill="#1d1715"/></g>
  <rect width="1000" height="1000" fill="url(#fog)"/>
  <g id="arcs" fill="none" stroke="#a9d8f2" stroke-width="1.2"><path d="M380 210 q40 -30 80 0"/><path d="M360 230 q60 -50 120 0"/><path d="M340 250 q80 -70 160 0"/></g>

<header><div style="display:flex;align-items:baseline"><a class="back" href="https://mitsulab.jp/" aria-label="mitsulab のホームへ戻る">← mitsulab</a><h1 id="ttl"></h1></div><span>氷川参道・大宮</span></header>
<p id="sub">参道のあちこちに、九つの寓話の灯があります。<small>どれからでも、ふれるとひらきます。</small></p>
<svg id="net" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>

  <div class="tag" id="ct"></div>
  <h2 id="ch"></h2>
  <div class="body" id="cb"></div>
  <div class="end" id="ce"></div>
  <details><summary>確かめた事実と、寓話にしたところ</summary><div id="cs"></div></details>
  <div class="row"><button id="prev">← まえ</button><button id="next">つぎ →</button></div>
</article>

<script>
/* 表示名はここだけで差し替える */
const NAME={en:"Qualia/",en2:"fable",ja:"寓話集"};
document.getElementById("ttl").innerHTML=NAME.en+"<i>"+NAME.en2+"</i>　"+NAME.ja;
document.title=NAME.en+NAME.en2+" ── "+NAME.ja;

/* x,y は画面の割合。地平（56%）のまわりに散らす＝中心を置かない */
const F=[
{n:"ミツバチ",c:"#b9a7ff",fx:"bee",x:.6,y:.86,t:"二つの目立つもの",
 b:"［人の目］\n朱の鳥居が、参道でいちばん目立つ。\n足もとの花は、一色に見える。\n\n［ミツバチの目］\nその朱は、暗い柱になると考えられている。\n花によっては、紫外の模様が浮かぶ。",
 e:"同じ参道に、二つの「目立つもの」がある。どちらが本当かは、決めずにおく。",
 s:["事実：ミツバチの視細胞の感度の山はおよそ 344・436・556 nm（紫外・青・緑）で、赤に感じる受容体を持たない（Peitsch, D. et al. 1992, J. Comp. Physiol. A 170: 23–40）。花には紫外の模様を持つものがある。ただし紫外がハチに特に目立つとは限らない（Kevan, P. G., Chittka, L. & Dyer, A. G. 2001, J. Exp. Biol. 204: 2571–2580）。","寓話にしたところ：鳥居の色の見え方は受容体からの推定の模式。ミツバチが鳥居をどう意味づけるかは書いていない。"]},
{n:"ケヤキ",c:"#9fd3a6",fx:"tree",x:0.84,y:0.36,t:"中心のない木",
 b:"──　あなたの心臓は、どこにありますか。\n\nケヤキに心臓はない。\n水は、葉から空へ出ていく水に引かれて、根から梢まで上がる。\n葉、細い管、根、土、空の乾き。\n\n──　では、あなたの中心は。\n\n寓話の問いに、答えは返らない。",
 e:"中心がなくても、つながりは保たれる。",
 s:["事実：木の水は、葉からの蒸散で生じる張力と、水の分子どうしの凝集力によって、道管・仮道管の中を切れずに上がる（凝集力-張力説。Dixon, H. H. & Joly, J. 1895, Phil. Trans. R. Soc. B 186: 563–576。Tyree, M. T. & Zimmermann, M. H. 2002, Xylem Structure and the Ascent of Sap, Springer）。","寓話にしたところ：ケヤキに尋ねる場面は寓話。木は答えない。"]},
{n:"アゲハ",c:"#f0d77c",fx:"fly",x:0.15,y:0.7,t:"胡蝶の夢",
 b:"［蝶の段］\nアゲハが葉にとまり、前脚の先で葉を味わう。\n卵を産む葉を、足で確かめている。\n\n［人の段］\nむかし、蝶になった夢を見た人（『荘子』斉物論の「胡蝶の夢」）が、目覚めて、\n自分が蝶の夢を見たのか、蝶が自分の夢を見ているのか、分からなくなった。\n\n足で葉を味わう世界から戻ると、手の中の葉が少しちがって見える。",
 e:"いまの見え方から離れて戻ると、同じ世界にまた出会う。",
 s:["事実：ナミアゲハは前脚の感覚毛で葉の成分を味わい、産卵する植物を見分ける（Ozaki, K. et al. 2011, Nature Communications 2: 542）。胡蝶の夢は『荘子』斉物論（内篇）。本文の「蝶になった夢を見た人」のくだりは mitsulab の要約。原文と訳：金谷治 訳注『荘子 第一冊（内篇）』岩波文庫、1971。","寓話にしたところ：蝶と人の夢を並べたのは寓話。どちらが本当かは決めない。"]},
{n:"ミミズ",c:"#b8b2a6",fx:"worm",x:.3,y:.79,t:"見ない夜",
 b:"目がない。\n\n体の表で、明るさを受けとる。\n明るいほうから、土へもぐる。\n\n昼の参道は、\nミミズには、ただもぐる明るさ。\n\n夜になると、地表へ出てくる。",
 e:"無いことで、見えてくるものがある。",
 s:["事実：ミミズは目を持たないが光に反応し、光を避ける（Darwin, C. 1881, The Formation of Vegetable Mould through the Action of Worms, John Murray）。体の表に光を受けとる細胞があるとされる。","寓話にしたところ：「もぐる明るさ」は詩の言い方。ミミズの感じ方の中身は分からない。"]},
{n:"コウモリ",c:"#a9d8f2",fx:"bat",x:.42,y:.2,t:"静かな空",
 b:"18時40分　参道の上を、コウモリが飛びはじめる。\n18時41分　人の耳には、静かな空。\n18時41分　同じ空を、人に聴こえない高い声が行き交う。\n18時42分　その跳ね返りで、虫のいる所が受けとられている。\n\n静かな空と、にぎやかな空が、同じ時刻に重なっている。",
 e:"静けさは、だれにとっての静けさだろう。",
 s:["事実：コウモリの多くは超音波を出し、その反響で周りや餌の位置をとらえる（反響定位。Griffin, D. R. 1958, Listening in the Dark, Yale University Press）。人に聴こえる高さの上限はおよそ 20 kHz。","寓話にしたところ：日本の市街地に広く見られるアブラコウモリを念頭に置いたが、この参道で記録したものではない。「にぎやか」は人の言い方。時刻は寓話の中のもので、飛びはじめる時刻は季節と日没で変わる。"]},
{n:"落ち葉",c:"#c9a46a",fx:"leaf",x:.46,y:.7,t:"閉じたあとに",
 b:"秋　ケヤキの葉が一枚、参道に落ちる。\n　　水を引き、光を受けていた葉のはたらきは、止まっている。\n\n夜　ミミズが、その葉を巣穴へ引きこむ。\n\n冬　葉は、土の生き物や菌の食べものになっていく。\n\n春　足もとの土に、去年の葉はもう見分けられない。\n　　葉のはたらきは戻らない。\n　　ほかの生き物の体と土の中に、その跡が残る。",
 e:"見分けられないことが、そこにあったことを消すわけではない。",
 s:["事実：ミミズは夜、落ち葉を巣穴へ引きこむ（Darwin, C. 1881, The Formation of Vegetable Mould through the Action of Worms, John Murray）。落ち葉は土の動物・菌・細菌によって分解され、養分が土へ戻る（Swift, M. J., Heal, O. W. & Anderson, J. M. 1979, Decomposition in Terrestrial Ecosystems, Blackwell）。","寓話にしたところ：葉や木が何かを感じるかは分からない。「跡が残る」は、分解された物質がほかの生き物の体や土に入ることを、ことばにしたもの。慰めの意味はこめていない。落ち葉を巣穴へ引きこむのは Darwin が観察したヨーロッパのミミズに典型的な行動で、この参道で確かめたものではない。"]},
{n:"マダニ",c:"#e3b07a",fx:"tick",x:0.2,y:0.45,t:"三つで満ちる",
 b:"一　酪酸の匂い。\n二　温かさ。\n三　毛のふれる感じ。\n\n枝の先で待つマダニの世界は、この寓話では、この三つでできている。\n参道の灯も、鳥の声も、そこには現れない。\nマダニの環世界の中には、外が現れない。",
 e:"あなたの世界の外は、あなたから見えますか。",
 s:["事実：ユクスキュルは、マダニが酪酸の匂い・温かさ・毛のある皮膚への接触という少ない手がかりで動く例を挙げ、生き物ごとの世界を「環世界」と呼んだ（J. v. ユクスキュル、G. クリサート『生物から見た世界』1934。日高敏隆・羽田節子訳、岩波文庫、2005）。","寓話にしたところ：マダニが世界を「満ちている」と感じるかは分からない。三つの手がかりで世界が閉じていることを、ことばにした。"]},
{n:"記録計",r:"<ruby>記録計<rt>きろくけい</rt></ruby>",c:"#5cc8e0",fx:"rec",x:.8,y:.64,t:"感じない記録",

/* 参道の敷石の目地：遠くほど詰まる（2026-11-10 第4周） */
(function(){let h="";for(let i=1;i<16;i++){const y=560+440*Math.pow(i/16,1.8),t=(y-560)/440,xl=470-230*t,xr=530+230*t;h+=`<line x1="${xl}" y1="${y}" x2="${xr}" y2="${y}" stroke-width="${.6+t*1.6}"/>`;}document.getElementById("joints").innerHTML=h;})();
/* 並木：目の高さから見た遠近（地平 y=560・消失点 x=500） */
(function(){const g=document.getElementById("trees");let h="",sh="",cr="";
 for(let i=0;i<9;i++){const k=Math.pow(.72,i),dx=470*k+30,w=26*k+2,top=560-430*k,bot=560+380*k;
  /* 2026-11-10 第5周：棒でなく幹に＝上へ細く・根もとが張り・片側に陰・上に樹冠の影 */
  for(const cx of [500-dx,500+dx]){const tw=w*.62,fl=w*1.9,j=(i*37%11)/11-.5;
   h+=`<path d="M${cx-tw/2} ${top} L${cx+tw/2} ${top} L${cx+w/2} ${bot-w*1.2} Q${cx+w*.62} ${bot-w*.3} ${cx+fl/2} ${bot} L${cx-fl/2} ${bot} Q${cx-w*.62} ${bot-w*.3} ${cx-w/2} ${bot-w*1.2}Z"/>`;
   sh+=`<path d="M${cx+(cx<500?tw*.05:-tw/2)} ${top} L${cx+(cx<500?tw/2:-tw*.05)} ${top} L${cx+(cx<500?w/2:-w*.1)} ${bot} L${cx+(cx<500?w*.1:-w/2)} ${bot}Z"/>`;
   cr+=`<ellipse cx="${cx+j*w*3}" cy="${top+8*k}" rx="${w*4.2+60*k}" ry="${w*2.2+70*k}"/><ellipse cx="${cx-j*w*4+(cx<500?-1:1)*w*2}" cy="${top+50*k}" rx="${w*3+40*k}" ry="${w*1.6+40*k}"/>`;}}
 g.innerHTML=h;document.getElementById("trees0").innerHTML=h;document.getElementById("shade").innerHTML=sh;document.getElementById("crowns").innerHTML=cr;})();

const box=document.getElementById("lights"),card=document.getElementById("card"),veil=document.getElementById("veil"),sub=document.getElementById("sub");
let cur=-1;const read=new Set();
F.forEach((f,i)=>{const b=document.createElement("button");b.className="lt";b.style.left=(f.x*100)+"%";b.style.top=(f.y*100)+"%";
 b.style.setProperty("--c",f.c);b.style.setProperty("--k",Math.max(0,Math.min(1,(f.y-.2)/.68)).toFixed(2));b.innerHTML="<i></i><span>"+(f.r||f.n)+"</span>";b.setAttribute("aria-label",f.n+"の寓話「"+f.t+"」をひらく");b.onclick=()=>open(i);box.appendChild(b);f.el=b;});
function open(i){cur=i;const f=F[i];
 document.getElementById("ct").textContent="寓話 "+(i+1)+" ／ "+F.length+"　"+f.n;
 document.getElementById("ch").textContent=f.t;
 document.getElementById("cb").textContent=f.b;
 document.getElementById("ce").textContent=f.e;
 document.getElementById("cs").innerHTML=f.s.map(x=>"<p></p>").join("");
 [...document.getElementById("cs").children].forEach((p,k)=>p.textContent=f.s[k]);
 card.querySelector("details").open=false;card.scrollTop=0;
 document.body.className=document.body.className.replace(/fx-\w+/g,"").trim();document.body.classList.add("fx-"+f.fx);card.classList.add("open");veil.classList.add("on");sub.style.opacity=0;
 read.add(i);f.el.classList.add("read");card.querySelector(".close").focus({preventScroll:true});}
/* 2026-11-09 第2周：読み終えの線は交差させない＝地平のまわりを角度の順に一周する一本の輪（網に見えないように・中心は置かない） */
const net=document.getElementById("net");{const P=F.map(f=>[f.x*100,f.y*100]).sort((p,q)=>Math.atan2(p[1]-56,p[0]-50)-Math.atan2(q[1]-56,q[0]-50));
net.innerHTML=`<path vector-effect="non-scaling-stroke" d="M${P.map(p=>p.join(" ")).join(" L")} Z"/>`;}
function close(){document.body.className=document.body.className.replace(/fx-\w+/g,"").trim();
 if(read.size===F.length&&!document.body.classList.contains("all")){document.body.classList.add("all");sub.innerHTML="九つの受けとり方が、<br>同じ参道で重なっていました。<small>顔を上げて、目の前の世界へ。</small>";}
 sub.style.opacity=1;card.classList.remove("open");veil.classList.remove("on");if(cur>=0)F[cur].el.focus({preventScroll:true});cur=-1;}
card.querySelector(".close").onclick=close;veil.onclick=close;
document.getElementById("next").onclick=()=>open((cur+1)%F.length);
document.getElementById("prev").onclick=()=>open((cur-1+F.length)%F.length);
addEventListener("keydown",e=>{if(cur<0)return;if(e.key==="Escape")close();if(e.key==="ArrowRight")open((cur+1)%F.length);if(e.key==="ArrowLeft")open((cur-1+F.length)%F.length);});
</script>
