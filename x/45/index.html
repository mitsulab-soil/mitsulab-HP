<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="tdm-reservation" content="1">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualia/lens</title>
<meta name="description" content="今この場所の景色と音を、その場で別の受けとり方に。カメラを犬・ミツバチ・ハエの見え方の模式に、マイクの音を遅く・速く聴きなおす。">
<meta property="og:title" content="Qualia/lens">
<meta property="og:description" content="今この場所の景色と音を、その場で別の受けとり方に。">
<style>
:root{--bg:#0f1412;--ink:#eef2ea;--dim:#aab7ad;--line:#33443b;--aoi:#5cc8e0;
--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--goth:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--goth);-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
#sp{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));height:56px;width:100%;z-index:2;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:3;background:linear-gradient(#0f1412cc,#0f141200)}
header a{color:var(--ink);text-decoration:none;font-size:20px;min-width:44px;min-height:44px;display:grid;place-items:center}
header b{font-family:var(--mincho);font-weight:600;letter-spacing:.06em;font-size:17px}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:4;background:var(--bg)}
#start h1{font-family:var(--mincho);font-weight:600;font-size:26px;letter-spacing:.1em;text-align:center;margin:0 0 6px}
#start .sub{color:var(--dim);font-size:14px;text-align:center;margin:0 0 22px}
#start button{display:block;margin:0 auto;font-family:var(--mincho);font-size:18px;letter-spacing:.08em;color:var(--ink);background:none;border:1px solid var(--aoi);border-radius:999px;padding:14px 28px;min-height:48px;cursor:pointer}
#start p.n{color:var(--dim);font-size:12px;text-align:center;margin:14px 16px 0;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:3;display:grid;gap:6px;justify-items:center;background:linear-gradient(#0f141200,#0f1412e6 30%)}
.row{display:flex;gap:6px;width:100%;max-width:560px;align-items:stretch}
.row>span{flex:0 0 34px;display:grid;place-items:center;font-family:var(--mincho);font-size:13px;color:var(--dim)}
.row button{flex:1;min-height:48px;font-family:var(--mincho);font-size:15px;color:var(--ink);background:#0f141299;border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:0 2px}
.row button small{display:block;font-family:var(--goth);font-size:10px;color:var(--dim)}
.row button[aria-pressed=true]{border-color:var(--aoi);box-shadow:inset 0 0 0 1px var(--aoi)}
#pitch{flex:0 0 64px}
#cap{position:fixed;left:16px;right:16px;bottom:calc(210px + env(safe-area-inset-bottom));z-index:3;text-align:center;font-size:13px;line-height:1.6;margin:0;text-shadow:0 1px 3px #000,0 0 8px #000}
#cap{font-size:14px;font-weight:500;text-shadow:0 0 2px #000,0 0 4px #000,0 1px 6px #000,0 0 14px #000a}
#cap small{display:block;color:#d6dde6;font-size:11px}
#cap .src{display:none}#cap.open .src{display:block}
#rest{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(6,9,8,.9);opacity:0;pointer-events:none;transition:opacity 1.2s}#rest.on{opacity:1;pointer-events:auto}#rest p{max-width:400px;margin:0;text-align:center;font-family:var(--mincho);font-size:17px;line-height:1.9;letter-spacing:.05em}#rest small{display:block;margin-top:14px;font-family:var(--goth);font-size:12px;color:var(--dim)}
#cap button{font:inherit;font-size:12px;color:var(--ink);background:none;border:1px solid #ffffff66;border-radius:999px;min-width:44px;min-height:32px;margin-top:4px;cursor:pointer;text-shadow:inherit}
</style>
</head>
<body>
<canvas id="cv" aria-label="カメラの映像を、選んだ生き物の見え方の模式に変えて映す画面"></canvas>
<canvas id="sp" aria-hidden="true"></canvas>
<header><a href="https://mitsulab.jp/" aria-label="mitsulab のトップへ戻る">←</a><b>Qualia/lens</b></header>
<div id="start"><div><h1>Qualia/lens</h1><p class="sub">今ここの景色と音を、別の受けとり方で。<br>見たら、顔を上げて実物と見くらべる。</p><button id="go" type="button">カメラとマイクをひらく</button><p class="n">映像と音は端末の中だけで変えます（音は直近 4 秒だけ持つ）。<br>保存も送信もしません。</p></div></div>
<nav aria-label="受けとり方">
 <div class="row" id="eyes"><span>目</span><button data-m="0" aria-pressed="true">人</button><button data-m="1" aria-pressed="false">犬</button><button data-m="2" aria-pressed="false">ミツバチ</button><button data-m="3" aria-pressed="false">ハエ</button></div>
 <div class="row" id="rates"><span>耳</span><button data-r="0.25" aria-pressed="false">¼<small>遅く</small></button><button data-r="0.5" aria-pressed="false">½<small>遅く</small></button><button data-r="1" aria-pressed="true">今<small>そのまま</small></button><button data-r="2" aria-pressed="false">×2<small>速く</small></button><button id="pitch" aria-pressed="false" aria-label="音の高さも変える（いまは高さを保つ）">高さ<small>保つ</small></button></div>
</nav>
<p id="cap" aria-live="polite" role="status"></p>
<div id="rest" role="status" aria-live="polite"><p><span></span><small>立ち止まって、顔を上げて。画面に触れると戻ります。</small></p></div>
<video id="v" playsinline muted hidden></video>
<script>
(()=>{
/* 出典は要旨で数値を確かめた（2026-11-19）。紫外線・超音波は捉えられないので、どれも模式 */
const EYE=[
 ['人の目。赤・緑・青の三つの錐体で見ている。',''],
 ['犬の目の模式。錐体は二種類（よく応える光は約 429 nm と 555 nm）で、赤と緑の区別がつきにくい。細かいところは人よりぼやける。','Neitz, Geist & Jacobs 1989 Visual Neuroscience 3:119／Miller & Murphy 1995 JAVMA 207:1623'],
 ['ミツバチの目の模式。受けとるのは紫外・青・緑（約 344・436・544 nm）で、赤は暗く沈む。見分けられる細かさは人のおよそ百分の一とされる（画面の粒は模式）。紫外線はカメラに写らないため描けない。','Peitsch et al. 1992 J Comp Physiol A 170:23／Srinivasan & Lehrer 1988 J Comp Physiol A 162:159'],
 ['ハエの目の模式。速く飛ぶハエの視細胞は光の変化に約 50〜107 Hz まで応じる。動いたところが、数コマの線で浮かぶ。','Laughlin & Weckström 1993 J Comp Physiol A 172:593']
];
const SH=['人の目。','犬の目の模式。赤と緑が近い色に。','ミツバチの目の模式。赤は暗く、粒は粗く。','ハエの目の模式。動いた所が線で浮かぶ。'];
const Q=['碧：さっきの目のあとで、いつもの色はどう見える？','碧：赤い実や花は、犬にはどこにあるだろう。','碧：蜂の目で見ると、花はまだ目立つだろうか。','碧：止まっているものと動いたもの、ハエにはどちらが先に届くだろう。'];
const cap=document.getElementById('cap');
/* 2026-11-20 本人「スマホを見つめるだけでなく、現実世界の捉え方が変わるように」：見たあとは画面を静め、自分の目と耳で確かめる間 */
const UP=['碧：顔を上げて、いつもの色を自分の目で見てみて。さっきと同じに見える？','碧：顔を上げて、赤い花や実を自分の目で探してみて。犬の目では、さっきの色だった。','碧：顔を上げて、近くの花を見てみて。蜂には、人に見えない紫外の模様が見えている花もある。','碧：顔を上げて、動いているものを一つ見つけてみて。葉か、人か、雲か。'];
const UPE='碧：顔を上げて、今の音を自分の耳で聴いてみて。さっきの遅い音の中にあったものは、聴こえる？';
const rest=document.getElementById('rest');let rt=0,rb=0;
function up(t){rest.querySelector('span').textContent=t;rest.classList.add('on');clearTimeout(rb);rb=setTimeout(()=>rest.classList.remove('on'),12000)}
rest.onclick=()=>rest.classList.remove('on');
function later(t,ms){clearTimeout(rt);rt=setTimeout(()=>{if(!document.hidden)up(t)},ms)}
let seen=0,pmode=0,t0=-1e9,mode=0,rate=1,keep=true,last='eye',noMic=0;
function plus(on){return on?'<br><button type="button" id="plus" aria-expanded="'+cap.classList.contains('open')+'" aria-label="出典をひらく">'+(cap.classList.contains('open')?'−':'＋')+'</button>':''}
cap.addEventListener('click',e=>{if(e.target.id=='plus'){cap.classList.toggle('open');render()}});
function render(){
 if(last=='eye'){const e=EYE[mode];cap.innerHTML=(seen>0?'<span style="display:block;font-family:var(--mincho);font-size:15px;margin-bottom:2px">'+Q[mode]+'</span>':'')+SH[mode]+(e[1]?'<small class="src">'+e[0]+'<br>出典：'+e[1]+'</small>':'')+plus(!!e[1]);return}
 const L={1:'今の音。人が聴けるのはおよそ 20 Hz〜20 kHz。',0.25:'直近 4 秒を ¼ の速さで。鳥が聴き分ける細かな音の変化が、人の耳でも追える。',0.5:'直近 4 秒を ½ の速さで。',2:'直近 4 秒を 2 倍の速さで。長い音のうねりが一つにまとまる。'};
 cap.innerHTML=L[rate]+(rate!=1?'<small>'+(keep?'高さを保ったまま速さだけ変えています。':'テープのように高さも一緒に変えています。')+'</small>':'')+
  (rate==0.25?'<small class="src">鳥は 1〜2 ms、人は 3〜4 ms ほどまで（出典：Dooling et al. 2002 J Acoust Soc Am 112:748）</small>'+plus(1):'<small>超音波はスマホのマイクではほとんど録れません。</small>')+(rate!=1&&!(el&&!el.paused)?'<small>同じボタンをもう一度押すと、新しい 4 秒を聴けます。</small>':'');
}
/* ---- 目（WebGL） ---- */
const cv=document.getElementById('cv'),v=document.getElementById('v');
const gl=cv.getContext('webgl');let src=null;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const vs='attribute vec2 p;varying vec2 u;void main(){u=p*.5+.5;gl_Position=vec4(p,0,1);}';
const fs=`precision mediump float;varying vec2 u;uniform sampler2D cur,prev,p2,p3;uniform int m;uniform vec2 res,vres;
vec2 cover(vec2 q){float a=res.x/res.y,b=vres.x/vres.y;vec2 s=a>b?vec2(1.,b/a):vec2(a/b,1.);return vec2((q.x-.5)*s.x+.5,1.-((q.y-.5)*s.y+.5));}
vec3 t(vec2 q){return texture2D(cur,cover(q)).rgb;}
vec3 blur(vec2 q,float r){vec3 c=vec3(0);for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++)c+=t(q+vec2(float(i),float(j))*r/res);return c/25.;}
uniform int m0;uniform float k;
vec3 eye(int m,vec2 u){vec3 c=t(u);
if(m==1){c=blur(u,2.2);float lm=dot(c,vec3(.45,.55,0.));c=vec3(lm*.95,lm*.92,c.b*.9+lm*.08);}
else if(m==2){vec2 cell=vec2(48.*res.x/res.y,48.);vec2 q=(floor(u*cell)+.5)/cell;c=blur(q,3.);
 float g=c.g,b=c.b;c=vec3(g*.15,g*.85+b*.1,b*.95);vec2 f=fract(u*cell)-.5;c*=1.-smoothstep(.36,.5,length(f))*.35;}
else if(m==3){vec2 q=cover(u);vec3 a=texture2D(prev,q).rgb,b2=texture2D(p2,q).rgb,c3=texture2D(p3,q).rgb;float l=dot(c,vec3(.3,.59,.11));
 float d0=smoothstep(.04,.25,length(c-a)),d1=smoothstep(.04,.25,length(a-b2)),d2=smoothstep(.04,.25,length(b2-c3));
 c=c*.45+vec3(l*.25)+vec3(.85,.95,.9)*d0+vec3(.55,.75,.8)*d1*.7+vec3(.35,.5,.6)*d2*.45;}
return c;}
void main(){vec3 c=eye(m,u);if(k<1.){float r=length((u-.5)*vec2(res.x/res.y,1.));float w=smoothstep(k*1.3-.25,k*1.3,r);if(w>.003)c=mix(c,eye(m0,u),w);}
gl_FragColor=vec4(c,1);}`;
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
function tex(){const x=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,x);for(const [k,w] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,w);return x}
const T=[tex(),tex(),tex(),tex()];let ti=0;
['cur','prev','p2','p3'].forEach((n,i)=>gl.uniform1i(gl.getUniformLocation(pr,n),i));
const uM0=gl.getUniformLocation(pr,'m0'),uK=gl.getUniformLocation(pr,'k'),uM=gl.getUniformLocation(pr,'m'),uR=gl.getUniformLocation(pr,'res'),uV=gl.getUniformLocation(pr,'vres');
/* ---- 耳 ---- */
const sp=document.getElementById('sp'),g=sp.getContext('2d');
let ac,an,fd,ring,ri=0,sr=48000,el=null,url=null;const SEC=4;
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height);sp.width=innerWidth*d;sp.height=56*d}
addEventListener('resize',size);size();
function wav(){const n=ring.length,b=new ArrayBuffer(44+n*2),d=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,ring[(ri+i)%n]));d.setInt16(44+i*2,s*32767,true)}return new Blob([b],{type:'audio/wav'})}
function stop(){if(el){el.pause();el=null}if(url){URL.revokeObjectURL(url);url=null}}
function play(){stop();if(rate==1||!ring)return;url=URL.createObjectURL(wav());el=new Audio(url);el.preservesPitch=keep;el.webkitPreservesPitch=keep;el.playbackRate=rate;el.onended=()=>{el=null;render();if(rate<1)later(UPE,600)};el.play().catch(()=>{})}
function setRate(r){rate=r;last='ear';document.querySelectorAll('#rates [data-r]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.r==r));r==1?stop():play();render()}
function setM(i){if(i==mode)return;seen++;pmode=mode;t0=performance.now();mode=i;last='eye';document.querySelectorAll('#eyes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==i));render();later(UP[i],14000)}
document.querySelectorAll('#eyes button').forEach(b=>b.onclick=()=>setM(+b.dataset.m));
document.querySelectorAll('#rates [data-r]').forEach(b=>b.onclick=()=>setRate(+b.dataset.r));
const pb=document.getElementById('pitch');pb.onclick=()=>{keep=!keep;last='ear';pb.setAttribute('aria-pressed',!keep);pb.querySelector('small').textContent=keep?'保つ':'変わる';pb.setAttribute('aria-label','音の高さも変える（いまは'+(keep?'高さを保つ':'高さも変わる')+'）');if(rate!=1)play();render()};
function frame(){requestAnimationFrame(frame);
 if(src&&src.videoWidth){ti=(ti+1)%4;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,T[ti]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,src);
  for(let k=1;k<4;k++){gl.activeTexture(gl.TEXTURE0+k);gl.bindTexture(gl.TEXTURE_2D,T[(ti+4-k)%4])}const kk=Math.min(1,(performance.now()-t0)/900),ke=kk*kk*(3-2*kk);gl.uniform1i(uM0,pmode);gl.uniform1f(uK,ke);gl.uniform1i(uM,mode);gl.uniform2f(uR,cv.width,cv.height);gl.uniform2f(uV,src.videoWidth,src.videoHeight);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
 if(an){an.getByteFrequencyData(fd);const W=sp.width,H=sp.height,s=Math.max(2,W/300|0);g.drawImage(sp,-s,0);g.clearRect(W-s,0,s,H);
  for(let y=0;y<H;y++){const hz=Math.pow(20000/40,1-y/H)*40;const k=Math.min(fd.length-1,hz/(sr/2)*fd.length|0);const a=fd[k]/255;if(a<.12)continue;g.fillStyle=`rgba(${92+a*120|0},200,224,${a*a})`;g.fillRect(W-s,y,s,1)}
  if(el&&!el.paused&&el.duration){g.fillStyle='#5cc8e0';g.fillRect(0,H-2,W*el.currentTime/el.duration,2)}}}
document.getElementById('go').onclick=async()=>{
 const n=document.querySelector('#start p.n');
 let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
 catch(e){try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e2){n.textContent='カメラとマイクをひらけませんでした。設定で許可してから、もう一度押してください。';return}}
 if(st.getVideoTracks().length){v.srcObject=new MediaStream(st.getVideoTracks());await v.play().catch(()=>{});src=v}
 if(st.getAudioTracks().length){ac=new (window.AudioContext||window.webkitAudioContext)();sr=ac.sampleRate;ring=new Float32Array(sr*SEC);
  const m=ac.createMediaStreamSource(new MediaStream(st.getAudioTracks()));an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.5;fd=new Uint8Array(an.frequencyBinCount);m.connect(an);
  const put=d=>{if(el&&!el.paused)return;for(let i=0;i<d.length;i++){ring[ri]=d[i];ri=(ri+1)%ring.length}};
  const z=ac.createGain();z.gain.value=0;z.connect(ac.destination);let pn;
  try{if(!ac.audioWorklet)throw 0;const code="registerProcessor('rec',class extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}})";
   const wu=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));await ac.audioWorklet.addModule(wu);URL.revokeObjectURL(wu);pn=new AudioWorkletNode(ac,'rec');pn.port.onmessage=e=>put(e.data)}
  catch(_){pn=ac.createScriptProcessor(2048,1,1);pn.onaudioprocess=e=>put(e.inputBuffer.getChannelData(0))}
  m.connect(pn);pn.connect(z)}
 else{document.querySelectorAll('#rates button').forEach(b=>b.disabled=true);noMic=1}
 document.getElementById('start').remove();render();if(noMic)cap.innerHTML+='<small>マイクが許可されていないため、耳の列は使えません。</small>'};
render();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
