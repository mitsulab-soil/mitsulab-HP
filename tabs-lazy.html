<p class="cg-eyebrow" translate="no">QUALIUM / THE COMMON GROUND</p><p class="sd-theme" data-i18n-en="The Butterfly Dream — into a dreamlike reality.">胡蝶の夢 ── 夢のような、現実へ。</p>
<h2 data-i18n-en="Different worlds. A place to meet."><span class="nw2">違う世界を</span><span class="nw2">生きながら、</span><br><span class="nw2">同じ場所で</span><span class="nw2">出会う。</span></h2>
<p data-i18n-en="Qualium is the landscape that rises where Umwelten overlap while keeping their differences. Different clues are brought to one place, and we reconsider how we engage.">Qualiumは、環世界が違いを残したまま重なって立ち上がる風景です。異なる手がかりを一つの場所へ持ち寄り、関わり方を考え直します。</p>
<p class="wv-eq"><span class="wv-dl" data-i18n-en="Qualium equation">Qualium 式</span><span translate="no">U<sub>i</sub> = f( <i>P</i><sub>i</sub>, <i>M</i><sub>i</sub>, <i>F</i> )</span></p><p class="wv-src" data-i18n-en="Uᵢ: the Umwelt of receiver i · P perception · M meaning-making · F field. A model mitsulab organised after Lewin’s B = f(P, E) and Uexküll’s Umwelt.">U<sub>i</sub>：受けとり手 i の環世界・P 知覚・M 意味づけ・F 場。レヴィンの B = f(P, E) とユクスキュルの環世界にならい、mitsulab が整理した模式。</p><button type="button" data-tab="top" data-i18n-en="Back to the top →">TOP へ戻る →</button>
<section id="umwelt1"><h3 data-i18n-en="01 / Start with a place">01 / 場所から始める</h3><div><p data-i18n-en="A tree can be a perch, shade, a remembered landmark, or a point in a temperature record. The physical tree is shared; the relationships that matter are different.">一本の木が、鳥には止まり場となり、人には木陰や思い出の目印となり、観測では温度の記録点となる。同じ物理的な場所でも、そこに結ばれる関係は異なります。</p><p data-i18n-en="An Umwelt is the meaningful world of a living subject, shaped through its body, senses, experience and activity. Learning about another way of sensing offers clues; it does not give us direct access to another creature’s experience.">環世界とは、生き物が身体・感覚・経験・活動を通して生きる、意味のある世界です。他の生き物の感覚を学ぶことは、その関係を考える手がかりになります。主観そのものを、そのまま受け取れるという意味ではありません。</p><p data-i18n-en="For machines, we compare what sensors acquire and models compute. These conditions do not establish that a machine has subjective experience.">機械について比べるのは、センサーが取得する情報やモデルが計算する範囲です。その条件から、機械に主観的体験があると決めるものではありません。</p></div></section>
<section id="define"><h3 data-i18n-en="02 / What we can share">02 / 何を共有するか</h3><div><p data-i18n-en="We can bring observations, conditions, interpretations and questions into relation. The common ground keeps their sources and limits visible, so that differences become something we can work with.">持ち寄るのは、観測、条件、解釈、問いです。どこから得た手がかりか、どこまで言えるかを辿れるようにする。違いを消さずに、その違いから考えられる場をつくります。</p><p data-i18n-en="The connections form around particular places and questions. No single point of view becomes the universal centre.">接点は、場所や問いに応じて生まれます。一つの見方を全体の中心に置かず、部分どうしが結ばれ、確かめ直せる構造を目指します。</p></div></section>
<section id="qualium-loop-explanation"><h3 data-i18n-en="03 / Translate and return">03 / 訳して、現実へ返す</h3><div><p data-i18n-en="Observe and record → compute relationships → translate into light, sound, vibration, space or words → feel and reconsider → act and observe again: the Qualium Loop.">観測・記録 → 計算で関係を捉える → 光・音・振動・空間・ことばへ訳す → 感じて考える → 行動し、また観測。この往復を Qualium Loop と呼びます。</p><p data-i18n-en="Aoi is a yorishiro: a body that carries clues, their sources and questions. She connects people with places without claiming to speak for nature’s feelings.">依代・碧は、手がかり・根拠・問いを渡す身体です。自然の気持ちを決めつけず、どこから得た情報かを辿りながら、人と場所をつなぎます。</p><p data-i18n-en="AI can help find patterns and compare records; GIS can relate them to place; xR can present them in space. The question remains: what does this let a person notice or do differently?"><span>AIは記録の比較やパターンの発見を助け、GISは場所に結び、xRは空間の中で示します。その結果、人が何に気づき、どう関われるかまでを設計します。</span></p></div></section>
<section id="outside"><h3 data-i18n-en="04 / A cognition that reaches beyond one individual">04 / 個に閉じない認知へ</h3><div><p data-i18n-en="Tools, records, other people and the environment participate in how we notice and decide. We explore cognition as an ongoing relationship among them, rather than a capacity measured within one person alone.">道具、記録、他の人、環境も、私たちが気づき、判断する過程に関わります。認知を一人の能力だけに閉じず、それらの関係が更新される過程として探究します。</p><p class="hyp-p" data-i18n-en="<span class=&quot;hyp-flag&quot;>Hypothesis</span>‘Computation as cognition’ and ‘cognition as computation’ are design propositions for investigating this relation. They are not proof that computation and subjective experience are identical."><span class="hyp-flag">仮説</span>「計算即認知」「認知即計算」は、その関係を探るための制作・研究上の命題です。計算と主観的体験が同一であると実証した主張ではありません。</p></div></section>
<section><h3 data-i18n-en="05 / What exists, what comes next">05 / 体験から、確かめる</h3><div><p data-i18n-en="Our browser works let you explore clues about sound, bodies and places. In workshops, people compare what they noticed. Real-time sharing across people and sensors is a research direction, not a feature offered by every work.">ブラウザ作品では、音・身体・場所についての手がかりを試せます。ワークショップでは、人が気づいたことを持ち寄ります。複数人やセンサーが常時つながる共有機能は研究の方向であり、すべての作品に実装済みではありません。</p><p data-i18n-en="We ask whether a person can notice something new, trace its source, revisit their interpretation and take a question back into everyday life.">新しい手がかりに気づけたか。出どころを辿れたか。自分の解釈を見直せたか。その問いを、道具を閉じたあとの日常へ持ち帰れたか。体験の価値を、そこから確かめていきます。</p><button type="button" data-tab="pf" data-i18n-en="Explore the works →">作品と道具へ →</button></div></section>
</div></template><template data-id="art"><div class="cg-tab-entry"><span translate="no">PORTFOLIO / CONNECTIONS</span><p data-i18n-en="Works, together.">作品を、一つの場所へ。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="pr-wrap"><p data-i18n-en="The works now share one portfolio. Continue directly to a work that interests you.">作品の一覧は、ポートフォリオにまとめました。気になる作品へ、そのまま進めます。</p><div class="pr-legacy-links"><button type="button" class="pr-link" data-go-anchor="work-sound" data-i18n-en="Calligraphy and sound →">書と音 →</button><button type="button" class="pr-link" data-go-anchor="work-sound" data-i18n-en="Structure of sound →">音の構造 →</button><button type="button" class="pr-link" data-go-anchor="work-song" data-i18n-en="Songs and imagery →">歌と映像 →</button><button type="button" class="pr-link" data-go-anchor="work-rakugo" data-i18n-en="A narrative encounter →">物語の一席 →</button><button type="button" class="pr-link" data-go-anchor="work-museum" data-i18n-en="Culture and interpretation →">文化と解釈 →</button></div><button type="button" class="pr-link" data-tab="pf" data-i18n-en="Portfolio →">ポートフォリオへ →</button></div></template><template data-id="writing"><div class="cg-tab-entry"><span translate="no">PORTFOLIO / CONNECTIONS</span><p data-i18n-en="Look again through words.">ことばから、見直す。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="pr-wrap"><p data-i18n-en="The works now share one portfolio. Continue directly to a work that interests you.">作品の一覧は、ポートフォリオにまとめました。気になる作品へ、そのまま進めます。</p><div class="pr-legacy-links"><button type="button" class="pr-link" data-go-anchor="work-scale" data-i18n-en="The story of a leaf →">一枚の葉の物語 →</button><button type="button" class="pr-link" data-go-anchor="work-note" data-i18n-en="Read research →">研究を読む →</button></div><button type="button" class="pr-link" data-tab="pf" data-i18n-en="Portfolio →">ポートフォリオへ →</button></div></template><template data-id="yorishiro"><div id="aoi"></div><div class="cg-tab-entry"><span translate="no">AOI / TRANSLATION</span><p data-i18n-en="A body between worlds.">世界のあいだに、身体を。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="pr-wrap pr-prose"><h2 translate="no">依代・碧 / Aoi</h2><p data-i18n-en="Aoi is a body that carries a place’s clues, sources and questions into forms people can feel and consider. Between the physical and the computational, she invites movement among ways of receiving without reducing them to one answer.">碧は、場所の手がかり・根拠・問いを、人が感じ考えられる形へ渡す身体です。現実と計算のあいだに立ち、異なる受けとり方を一つの正解にせず、行き来のきっかけをつくります。</p><div class="pr-actions"><a class="pr-link" href="x/17/" target="_blank" rel="noopener" data-i18n-en="Try Aoi’s short guide ↗">碧の短い案内を試す ↗</a></div><h3 data-i18n-en="Offer a clue.">手がかりを示す。</h3><p data-i18n-en="Place records and sensory mechanisms beside what is visible. Make their origins traceable and distinguish observation, illustration and artistic invention.">見えているもののそばに、記録や感覚の仕組みを重ねます。どこから得た情報かを辿り、観測・模式・創作を区別できるようにします。</p><h3 data-i18n-en="Return a question.">問いを返す。</h3><p data-i18n-en="Aoi does not speak for nature or others; she asks how this reaches you, so you can reconsider the place after closing the tool.">自然や他者の内面を代弁せず、「あなたには、どう感じられるか」を開きます。道具を閉じたあと、同じ場所との関わりを考え直すために。</p><h3 data-i18n-en="A body in the scene.">現れる身体。</h3><p data-i18n-en="Aoi stands in the scene in real-time 3D, guiding through voice and subtitles. Choose “Meet Aoi” on the TOP scene to hear her within the same landscape.">碧はリアルタイム3Dで場に立ち、声と字幕で案内します。TOPの「碧に会う」を押すと、同じ風景の中で説明を聴けます。</p><button type="button" class="pr-link" data-tab="qualium" data-i18n-en="Explore Qualium →">Qualiumの考え方へ →</button></div></template><template data-id="collab"><div class="v2-content">

        <p class="qm-lead" data-i18n-en="Walk the same approach, bring photos, sounds and textures that caught your attention, and compare the differences. Return to the place together with a fresh question.">同じ参道を歩き、それぞれが気づいた写真・音・手ざわりを持ち寄ります。違いを並べて話し、もう一度その場所を見直す会です。</p>


        <p class="qm-lead" data-i18n-en="Workshops are held on the Hikawa approach in Omiya (90 min, mornings). The works they use are in the Portfolio. We tell you the meeting point after you apply.">大宮・氷川参道で開きます（90 分・朝）。使う作品はポートフォリオにあります。集合場所は申込みのあとにお知らせします。</p>

<div class="v2-portfolio v2-social" id="social">
      <section class="si-sec" aria-labelledby="socialH">
        <p class="qx-code qx-sec-code" translate="no">SOCIAL</p>
        <h2 class="qx-h qx-sec-h" id="socialH" data-i18n-en="What we can do together">一緒にできること</h2>
        <p class="qm-lead" data-i18n-en="Social implementation: we bring mitsulab’s tools to people who look after a place, town or way of learning, and shape them together. Each card opens to aims, place, partners and process. Effects not yet proven.">社会実装。mitsulab の道具を、場所・町・学びの場を担う人のもとへ持ちこみ、一緒に形にします。「＋」で、ねらい・場所・相手・進め方が開きます。効果はまだ確かめていません。</p>
        <ol class="si-steps" data-i18n-en="&lt;li&gt;&lt;span class=&quot;si-n&quot;&gt;1&lt;/span&gt;Listen: what the place and its people already care about&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;si-n&quot;&gt;2&lt;/span&gt;Try small: one walk, one lesson, one corner&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;si-n&quot;&gt;3&lt;/span&gt;Fix together, and make it something that can continue&lt;/li&gt;"><li><span class="si-n">1</span>聞く：その場所と人が大切にしていること</li><li><span class="si-n">2</span>小さく試す：一回の散歩、一つの授業、展示の一角</li><li><span class="si-n">3</span>一緒に直し、続けられる形にする</li></ol>
        <ol class="si-grid si-inline">
      <li class="si-card" style="--c:#d9b382"><details class="si-fold"><summary><span class="si-k" translate="no">TOWN WALKS</span><span class="si-name" data-i18n-en="Town walks and rediscovering places">まち歩きと<wbr>場所の<wbr>再発見</span><span class="si-what" data-i18n-en="Walking with unseen layers, finding new value in a familiar place.">見えていなかった層を受けとりながら歩き、見慣れた場所に新しい価値を見いだす。</span><span class="si-more" data-i18n-en="More">詳しく</span></summary><div class="si-body ws-body" data-i18n-en="&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Aim&lt;/span&gt;Walk a familiar town again, with its unseen layers: rivers kept in place names, old roads kept in slope names, the histories of shops, laid with sources.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Where&lt;/span&gt;Omiya (the Hikawa approach), Kawagoe (the storehouse street and back lanes), Shibuya: places where Qualium already has layers.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;With&lt;/span&gt;People who run town walks, shops, visitor centres.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Tools&lt;/span&gt;Qualia/omiya, kawagoe, shibuya.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;How&lt;/span&gt;Walk together in a small group → revise the words and order of the layers with the guides → make it something people can walk on their own from a shop or visitor centre.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Now&lt;/span&gt;The apps are public. The first step is one walk together in a small group. We are looking for partners to walk with.&lt;/p&gt;"><p class="ws-row"><span class="ws-rk">ねらい</span>見慣れた町を、見えていなかった層ごと歩きなおす。地名に残る川、坂の名に残る道、店の来歴を、出典つきの層として重ねます。</p><p class="ws-row"><span class="ws-rk">どこで</span>大宮（氷川参道）・川越（蔵造りの通りと裏路地）・渋谷。いずれも Qualium で層を作っている場所です。</p><p class="ws-row"><span class="ws-rk">誰と</span>まち歩きの担い手、商店、観光案内所。</p><p class="ws-row"><span class="ws-rk">道具</span>Qualia/omiya・Qualia/kawagoe・Qualia/shibuya。</p><p class="ws-row"><span class="ws-rk">進め方</span>少人数で一緒に歩く → 層の言葉と並びを担い手と直す → 案内所や店先から自分で歩ける形にする。</p><p class="ws-row"><span class="ws-rk">いまの段階</span>アプリは公開中。最初の一歩は、少人数で一度一緒に歩くこと。一緒に歩く相手を探しています。</p></div></details></li>
      <li class="si-card" style="--c:#c9abe0"><details class="si-fold"><summary><span class="si-k" translate="no">LEARNING</span><span class="si-name" data-i18n-en="Learning for children and adults">子どもと<wbr>大人の<wbr>学び</span><span class="si-what" data-i18n-en="Seeing the world through other creatures’ senses, children and adults together.">ほかの生き物の目や耳で世界を見る学びを、子どもと大人が一緒に。</span><span class="si-more" data-i18n-en="More">詳しく</span></summary><div class="si-body ws-body" data-i18n-en="&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Aim&lt;/span&gt;Trying out, with the body, how differently the same place is taken in through other creatures’ eyes and ears.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Where&lt;/span&gt;Classrooms and school grounds, a corner of a museum, family learning spaces.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;With&lt;/span&gt;Teachers, curators, people who run family learning.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Tools&lt;/span&gt;Qualia/sight, Qualia/museum.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;How&lt;/span&gt;Try it in one lesson or one corner → revise with what children and teachers say → hand it over as a lesson plan.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Now&lt;/span&gt;The apps are public. We are looking for places to try them.&lt;/p&gt;"><p class="ws-row"><span class="ws-rk">ねらい</span>ほかの生き物の目や耳で同じ場所を見て、受けとり方の違いを体で確かめてみる学び。</p><p class="ws-row"><span class="ws-rk">どこで</span>学校の教室と校庭、博物館の展示の一角、親子の学びの場。</p><p class="ws-row"><span class="ws-rk">誰と</span>先生、学芸員、親子の学びを開く人。</p><p class="ws-row"><span class="ws-rk">道具</span>Qualia/sight・Qualia/museum。</p><p class="ws-row"><span class="ws-rk">進め方</span>一つの授業や展示の一角で試す → 子どもの言葉と先生の声を聞いて直す → 授業案として手渡せる形にする。</p><p class="ws-row"><span class="ws-rk">いまの段階</span>アプリは公開中。試す場を探しています。</p></div></details></li>
      <li class="si-card" style="--c:#8fb6dc"><details class="si-fold"><summary><span class="si-k" translate="no">ACCESS</span><span class="si-name" data-i18n-en="Sharing senses and experiences">感覚と<wbr>体験の<wbr>共有</span><span class="si-what" data-i18n-en="Translating senses through touch and sound with people who cannot see or hear.">見えない人・聞こえない人と、手ざわりや音で感覚を訳し合う。</span><span class="si-more" data-i18n-en="More">詳しく</span></summary><div class="si-body ws-body" data-i18n-en="&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Aim&lt;/span&gt;Translating senses with people who cannot see or hear, through texture and sound; making layers that can be taken in without a screen.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Where&lt;/span&gt;Places you can take in on foot, such as a shrine approach or a park.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;With&lt;/span&gt;People with lived experience, support groups.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Tools&lt;/span&gt;Qualia/touch, Qualia/sound.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;How&lt;/span&gt;Test together from the start → revise so that it never speaks on anyone’s behalf → publish what we made together.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Now&lt;/span&gt;At the planning stage. We are looking for people to make it with.&lt;/p&gt;"><p class="ws-row"><span class="ws-rk">ねらい</span>見えない人・聞こえない人と、手ざわりや音で感覚を訳し合う。画面を見なくても受けとれる層を作ります。</p><p class="ws-row"><span class="ws-rk">どこで</span>参道や公園など、歩いて受けとれる場所。</p><p class="ws-row"><span class="ws-rk">誰と</span>当事者の方、支援の団体。</p><p class="ws-row"><span class="ws-rk">道具</span>Qualia/touch・Qualia/sound。</p><p class="ws-row"><span class="ws-rk">進め方</span>はじめから当事者と一緒に試す → 受けとり方を代わりに語らない形に直す → 一緒に作った形を公開する。</p><p class="ws-row"><span class="ws-rk">いまの段階</span>構想の段階です。一緒に作る相手を探しています。</p></div></details></li>
      
      
      <li class="si-card" style="--c:#e79592"><details class="si-fold"><summary><span class="si-k" translate="no">HERITAGE</span><span class="si-name" data-i18n-en="Local memory and culture">地域と<wbr>文化の<wbr>継承</span><span class="si-what" data-i18n-en="Laying residents’ memories, old photos and festival sounds over the place, with sources.">町の人の記憶・古い写真・祭りの音を、典拠つきの層として場所に重ねる。</span><span class="si-more" data-i18n-en="More">詳しく</span></summary><div class="si-body ws-body" data-i18n-en="&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Aim&lt;/span&gt;Lay residents’ memories, old photographs and festival sounds over the place as sourced layers, and keep them.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Where&lt;/span&gt;We decide the place together with partners.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;With&lt;/span&gt;Residents, preservation societies, local archives.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Tools&lt;/span&gt;Qualium.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;How&lt;/span&gt;Hold gatherings where people bring stories and photographs → make layers only from what each person chooses, with sources → walk with residents to check them.&lt;/p&gt;&lt;p class=&quot;ws-row&quot;&gt;&lt;span class=&quot;ws-rk&quot;&gt;Now&lt;/span&gt;At the planning stage. We are looking for people to record with.&lt;/p&gt;"><p class="ws-row"><span class="ws-rk">ねらい</span>町の人の記憶・古い写真・祭りの音を、出典つきの層として場所に重ねて残す。</p><p class="ws-row"><span class="ws-rk">どこで</span>場所は、相手と一緒に決めます。</p><p class="ws-row"><span class="ws-rk">誰と</span>町の人、保存会、郷土の資料館。</p><p class="ws-row"><span class="ws-rk">道具</span>Qualium。</p><p class="ws-row"><span class="ws-rk">進め方</span>聞きとりと写真を持ち寄る会を開く → 本人が選んだものだけを、出典を添えて層にする → 町の人と一緒に歩いて確かめる。</p><p class="ws-row"><span class="ws-rk">いまの段階</span>構想の段階です。一緒に記録する相手を探しています。</p></div></details></li>
        </ol>
        <p class="qm-lead ws-note" data-i18n-en="To start with a conversation: &lt;a href=&quot;mailto:official@mitsulab.jp&quot;&gt;official@mitsulab.jp&lt;/a&gt;">まずは話を聞かせてください：<a href="mailto:official@mitsulab.jp" aria-label="メール official@mitsulab.jp">official@mitsulab.jp</a></p>
      </section>

    </div></template><template data-id="story"><div class="cg-tab-entry"><span translate="no">ORIGIN / FROM THE FIELD</span><p data-i18n-en="The inquiry began with field experience and encounters with different ways of knowing.">場所に立ち、異なる知に出会う。その経験から、mitsulabの探究は始まりました。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="v2-content">
<div class="v2-originwrap">
    <section class="qt-origin" id="origin" aria-labelledby="qtOriginTitle"><div><p class="qx-code qx-sec-code" translate="no">ORIGIN</p><h2 class="qx-h qx-sec-h" id="qtOriginTitle" data-i18n-en="Founding story">創業ストーリー</h2></div><div class="qt-story qt-poem">
<p class="poem-st" data-i18n-en="I have walked cities in 11 countries and regions, and in towns across Japan.&lt;br&gt;Water running beneath the paving stones. Festival memories deep in the alleys.&lt;br&gt;Old rivers kept in place names; old roads kept in the names of slopes.&lt;br&gt;Springs in shrine grounds. The rings inside a tree. Small lives in the soil.&lt;br&gt;Unseen layers, one over another.">十一の国と地域で、日本の町で、都市を歩いてきた。<br>石畳の下の水の道。路地の奥の<wbr>祭りの記憶。<br>地名に残る昔の川。坂の名に残る<wbr>古い道。<br>境内に湧く水。樹の年輪。<wbr>土の中の、小さな生きもの。<br>見えない層が、幾重にも重なっていた。</p>
<p class="poem-st" data-i18n-en="On a civil-engineering site, I led the recovery from a major landslide.&lt;br&gt;Before the collapsed slope, I learned:&lt;br&gt;a place holds many times more memory than its visible form.">土木の現場で、大きな地すべりの<wbr>復旧を指揮した。<br>崩れた斜面の前で知った。<br>場所は、見える形の何倍もの<wbr>記憶を抱えている。</p>
<p class="poem-st" data-i18n-en="It began when I joined a project to restore the soil environment along the Hikawa approach.&lt;br&gt;I grew curious about the life in the soil and the cycling of matter beneath it.&lt;br&gt;At the same time, I realised:&lt;br&gt;in civil engineering, working on disaster recovery, I had faced the soil —&lt;br&gt;yet seen it from only one side.">氷川参道の<wbr>土中環境再生に<wbr>加わったことが、きっかけだった。<br>土の中の生態系と<wbr>物質の循環に、<wbr>興味を持った。<br>同時に、気づかされた。<br>土木工事で<wbr>災害復旧に携わり、<wbr>土と向き合ってきたのに、<br>一つの面からしか<wbr>見ていなかったことに。</p>
<p class="poem-st" data-i18n-en="So I keep walking —&lt;br&gt;the Kannon pilgrim routes of Chichibu, Bandō and Edo,&lt;br&gt;Bashō’s Narrow Road to the Deep North, the Nakasendō between Edo and Kyoto:&lt;br&gt;old roads walked for centuries, which I now trace step by step.&lt;br&gt;I have now visited more than three hundred museums and galleries.&lt;br&gt;The unseen layers that AI and maps have begun to record&lt;br&gt;have not yet reached those who walk.">だから、いまも歩きつづけている。<br>秩父、坂東、江戸の<wbr>観音札所。<br>芭蕉の奥の細道。<wbr>江戸と京を結んだ中山道。<br>人がたどってきた道を、<wbr>自分の足で、一つずつ。<br>巡った博物館と美術館は、<wbr>三百を超えた。<br>AI と地図が記録しはじめた<wbr>見えない層は、<br>まだ、歩く人に届いていない。</p>
<p class="poem-st" data-i18n-en="To lay those layers over the landscape, one by one,&lt;br&gt;so that people can dive into them —&lt;br&gt;as a perception artist, with Aoi — a body that translates between layers — I founded mitsulab.">その層を一層ずつ、<wbr>風景に重ねる。<br>人が、そこへ潜れるように。<br>知覚作家として、碧とともに、<wbr>mitsulab を立ち上げた。</p>
<button class="qt-text-link" type="button" data-go-anchor="profile" data-i18n-en="Profile">代表プロフィール</button></div></section>


  
    </div></div></template><template data-id="museum"><div class="cg-tab-entry"><span translate="no">FOR MUSEUMS / ENCOUNTERS</span><p data-i18n-en="From viewing an exhibition to reconsidering our relationship with the world.">展示を見る体験から、世界との関係を捉え直す体験へ。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="rd"><p class="rd-k" translate="no">FOR MUSEUMS</p><h2 class="rd-h">美術館・展示の方へ</h2><p class="rd-lead">展示の場で使える作品と、その形式です。</p><div class="rd-s"><h3 data-i18n-en="Works you can exhibit">展示できる作品</h3><ul class="mu-g"><li><a href="x/09/" target="_blank" rel="noopener"><span class="mu-im"><img src="img/apps/qualium/omiya_play_640.webp" alt="" width="640" height="400" loading="lazy" decoding="async"></span><b translate="no"><i>Qualia/</i>omiya</b><span data-i18n-en="Walk the real approach in life-size 3D, layered with senses.">実在の参道を実寸の 3D で歩き、感覚の層を重ねる。</span></a></li><li><a href="/x/02/" target="_blank" rel="noopener"><span class="mu-im"><img src="img/apps/common-ground-20261107/sight_r3_640.webp" alt="" width="640" height="400" loading="lazy" decoding="async"></span><b translate="no"><i>Qualia/</i>sight</b><span data-i18n-en="Walk one forest, switching to other creatures’ ways of receiving.">一つの森を、ほかの生き物の受けとり方に切りかえて歩く。</span></a></li><li><a href="/x/10/" target="_blank" rel="noopener"><span class="mu-im"><img src="img/apps/vid/touch_poster.webp" alt="" width="640" height="400" loading="lazy" decoding="async"></span><b translate="no"><i>Qualia/</i>touch</b><span data-i18n-en="Raise a relief from an image and feel it by fingertip and vibration.">画像から凹凸の面を起こし、指先と振動で確かめる。</span></a></li><li><a href="/x/07/" target="_blank" rel="noopener"><span class="mu-im"><img src="img/apps/night-20261108/sound_640.webp" alt="" width="640" height="400" loading="lazy" decoding="async"></span><b translate="no"><i>Qualia/</i>sound</b><span data-i18n-en="Build sound on the spot from words and calligraphy.">言葉や書から、その場で音を組み立てる。</span></a></li><li><a href="https://mitsulab-soil.github.io/museum/" target="_blank" rel="noopener"><span class="mu-im"><img src="img/apps/common-ground-20261107/museum_640.webp" alt="" width="640" height="400" loading="lazy" decoding="async"></span><b translate="no"><i>Qualia/</i>museum</b><span data-i18n-en="Tour rooms of a hundred views of soil, rain, wind, snow, creatures, vegetables, moon and sun, and weather lore, with Aoi.">つち・あめ・かぜ・ゆき・いきもの・やさい・つき・たいようの百景と観天望気の部屋を、碧と巡る。</span></a></li><li><a href="https://mitsulab-soil.github.io/aoi-shizen-rakugo/" target="_blank" rel="noopener"><span class="mu-im"><img src="img/apps/common-ground-20261107/rakugo_640.webp" alt="" width="640" height="400" loading="lazy" decoding="async"></span><b translate="no"><i>Qualia/</i>rakugo</b><span data-i18n-en="Meet ways of seeing nature through Aoi’s rakugo.">碧の一席から、生き物や自然の見方に出会う。</span></a></li></ul><p class="mu-go"><a class="sd-go-b" href="https://mitsulab-soil.github.io/museum/" target="_blank" rel="noopener" data-i18n-en="Enter Qualia/museum ↗">Qualia/museum に入る ↗</a></p></div><div class="rd-s"><h3>形式と機材</h3><ul class="rd-l"><li><b>動く仕組み</b><span>どれもブラウザで動く。インストールは要らない。</span></li><li><b>見せ方</b><span>PC と大きな画面で一人ずつ操作する形、またはタブレット・スマホで手にとる形。</span></li><li><b>必要なもの</b><span>PC かタブレット、画面、インターネットの接続。触覚は振動に対応した端末で。</span></li></ul><p class="rd-note">設置の形・台数・会期は、会場に合わせて相談して決めます。</p></div><div class="rd-ct"><p>展示のご相談は、こちらへ。</p><a href="mailto:official@mitsulab.jp" aria-label="メール official@mitsulab.jp">official@mitsulab.jp</a></div></div></template><template data-id="region"><div class="cg-tab-entry"><span translate="no">FOR PLACES / LOCAL KNOWLEDGE</span><p data-i18n-en="Connect local records and everyday life with the actual places they describe.">土地に重なる記録と暮らしを、実際の場所に戻る手がかりへ。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="rd"><p class="rd-k" translate="no">FOR TOURISM AND REGIONS</p><h2 class="rd-h">観光・地域の方へ</h2><p class="rd-lead">一つの町に、その場所の記憶・音・自然の層を重ねて歩く作品をつくっています。</p><div class="rd-s"><h3>いま歩ける町</h3><ul class="rd-l"><li><b><a href="x/09/" target="_blank" rel="noopener">Qualia/omiya</a></b><span>氷川参道の一の鳥居から氷川神社・大宮公園まで。</span></li><li><b><a href="x/12/" target="_blank" rel="noopener">Qualia/kawagoe</a></b><span>一番街の蔵造り、時の鐘、喜多院、裏路地まで。</span></li><li><b><a href="x/14/" target="_blank" rel="noopener">Qualia/shibuya</a></b><span>スクランブル交差点から、暗渠から出る渋谷川まで。</span></li></ul></div><div class="rd-s"><h3>つくる流れ</h3><ol class="rd-l"><li><span>歩く範囲と、その町で重ねたいもの（歴史・音・自然）を一緒に決める。</span></li><li><span>国土地理院の地形と空中写真、PLATEAU や OpenStreetMap の建物と道から、町の 3D を組む。</span></li><li><span>一次の出典で確かめた記録から、碧の語りと層をつくる。出典のないことは語らない。</span></li><li><span>現地で試し歩きをして直し、ブラウザで公開する。</span></li></ol></div><div class="rd-s"><h3>使いみち</h3><ul class="rd-l"><li><b>まち歩き</b><span>大通りから離れ、裏路地まで歩く理由をつくる。</span></li><li><b>学び</b><span>校外学習や展示の手引きとして、歩きながら層を見比べる。</span></li><li><b>話し合い</b><span>川や道の計画を同じ 3D の風景で見ながら話す。</span></li></ul></div><div class="rd-ct"><p>導入のご相談は、こちらへ。</p><a href="mailto:official@mitsulab.jp" aria-label="メール official@mitsulab.jp">official@mitsulab.jp</a></div></div></template><template data-id="invest"><div class="cg-tab-entry"><span translate="no">SUPPORT / CONTINUITY</span><p data-i18n-en="Help sustain the works, research and open experiences.">作品と研究を続け、開かれた体験を育てるために。</p><a href="#top" data-tab="top" data-i18n-en="← Back to the common ground">← コモングラウンドへ戻る</a></div><div class="rd"><p class="rd-k" translate="no">SPONSORSHIP</p><h2 class="rd-h" data-i18n-en="Sponsorship">協賛</h2><p class="rd-lead" data-i18n-en="mitsulab is looking for people and organisations who would like to support its work as sponsors.">mitsulab の活動を、協賛で支えてくださる方を募っています。</p><div class="rd-s"><h3 data-i18n-en="What it supports">支えていただくもの</h3><ul class="rd-l"><li><b data-i18n-en="Qualium">Qualium</b><span data-i18n-en="Building the towns in 3D and developing the layers of sound, touch and other creatures’ eyes.">町の 3D と、音・触覚・生き物の目の層をつくる開発。</span></li><li><b data-i18n-en="Workshops">ワークショップ</b><span data-i18n-en="Walking a place with others and checking the layers with our own senses.">人と一緒に場所を歩き、層を自分の感覚で確かめる会。</span></li><li><b data-i18n-en="Research">研究</b><span data-i18n-en="Reading the original papers and checking the sources behind what Aoi says.">もとの論文を読み、碧が語ることの出典を確かめる仕事。</span></li></ul></div><div class="rd-s"><h3 data-i18n-en="Sponsors">協賛のかたち</h3><ul class="rd-l"><li><b data-i18n-en="Who">どなたでも</b><span data-i18n-en="Individuals and organisations alike. Please get in touch about the amount and form.">個人・団体のどちらでも。金額とかたちはご相談ください。</span></li><li><b data-i18n-en="Names">お名前</b><span data-i18n-en="We will list the names of sponsors who wish it, here on this page.">ご希望の方のお名前を、この場所に載せます。</span></li></ul></div><div class="rd-ct"><p data-i18n-en="For sponsorship, please write to:">協賛についてのご相談は、こちらへ。</p><a href="mailto:official@mitsulab.jp" aria-label="メール official@mitsulab.jp">official@mitsulab.jp</a></div></div></template><template data-id="partner"><div class="rd"><p class="rd-k" translate="no">FOR PARTNERS</p><h2 class="rd-h">異なる手がかりを、持ち寄る。</h2><p class="rd-lead">場所の記録、専門知、日々の気づき。異なる受けとり方に触れられる体験を、一緒につくります。</p><div class="rd-s"><h3>一緒にできること</h3><ul class="rd-l"><li><b>場所をつくる</b><span>土地の記録や知識をお持ちの方と、その場所の層をつくる。</span></li><li><b>ワークショップ</b><span>人と一緒に場所を歩いて確かめる。</span></li><li><b>研究</b><span>知覚・環世界・空間の研究を、作品として形にする。</span></li><li><b>技術</b><span>3D・音・触覚・地理情報の技術を持ち寄る。</span></li></ul></div><div class="rd-s"><h3>展示の一角から。</h3><p>一人3分ほどの導入例。一本の木を「人」と「蜂」の手がかりで見比べ、何が変わり何が描かれていないかを話す。帰り道に本物の木で花・実・止まり場を探す。</p><p>まずはブラウザで動く作品を、画面と操作端末で試します。会場の明るさ・音量・観客の操作方法を確かめ、場所に合わせて構成します。</p><button type="button" class="btn" data-tab="pf">作品を試す →</button><button type="button" class="btn" data-tab="contact">展示を相談する →</button></div><div class="rd-ct"><p>協働のご相談は、こちらへ。</p><a href="mailto:official@mitsulab.jp" aria-label="メール official@mitsulab.jp">official@mitsulab.jp</a></div></div></template>
