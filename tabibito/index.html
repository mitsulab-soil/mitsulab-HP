:root{--bg:#03070b;--a:#a8f2f6;--on:#f2c98a;--cv:#c4b0f5;--un:#2f4a52;--ink:#dcefF1;--dim:#6f8b90;--line:#a8f2f61c}
*{box-sizing:border-box;margin:0}html,body{overflow-x:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#0a1820 0%,var(--bg) 60%);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;min-height:100vh}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

#jpv,#wv{transition:opacity .4s}
